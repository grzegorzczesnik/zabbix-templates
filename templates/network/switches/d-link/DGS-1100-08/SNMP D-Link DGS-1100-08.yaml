zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: f1d5a1ddc34942c18982e3f5eaabdbb9
      template: 'SNMP D-Link DGS-1100-08'
      name: 'SNMP D-Link DGS-1100-08'
      description: |
        SNMPv2c monitoring of the D-Link DGS-1100-08 switch: availability (ICMP, SNMP), system information with host inventory, SNMP security counters, management-plane statistics and per-port statistics via LLD (IF-MIB, ifDescr).
        Requirements: SNMP interface on the host with the correct community; ICMP from the Zabbix server/proxy to the switch. Uses standard MIB-II / IF-MIB only.
        Port-level thresholds are context macros keyed by the port name ({#IFNAME}).
        PL: Monitoring switcha D-Link DGS-1100-08 przez SNMPv2c: dostępność (ICMP, SNMP), informacje systemowe z wpisem do inwentarza, liczniki bezpieczeństwa SNMP, statystyki płaszczyzny zarządzania i statystyki portów przez LLD (IF-MIB, ifDescr).
        PL: Wymagania: interfejs SNMP na hoście z poprawnym community; ICMP z serwera/proxy Zabbixa do switcha. Używa wyłącznie standardowych MIB-II / IF-MIB.
        PL: Progi per port to makra kontekstowe z nazwą portu ({#IFNAME}).
        
        Author: Grzegorz <grzegorz@net59.pl>, <grzegorz.czesnik@hotmail.com>
      vendor:
        name: 'Grzegorz Cześnik <grzegorz@net59.pl>'
        version: 7.4-2
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: d124504899864e028a93107d2e83dae7
          name: 'ICMP: Ping'
          type: SIMPLE
          key: icmpping
          description: |
            Reachability of the switch by ICMP ping from the Zabbix server/proxy (1 = up, 0 = down).
            PL: Osiągalność switcha przez ICMP ping z serwera/proxy Zabbixa (1 = dostępny, 0 = niedostępny).
          valuemap:
            name: 'Service state'
          tags:
            - tag: component
              value: icmp
            - tag: scope
              value: availability
          triggers:
            - uuid: 34515bec9f224d2eb7275b5110b162e6
              expression: 'max(/SNMP D-Link DGS-1100-08/icmpping,3m)=0'
              name: 'Availability: Unavailable by ICMP ping'
              priority: HIGH
              description: |
                No ICMP replies from the switch for 3 minutes. Check power, the uplink and the path from the Zabbix server/proxy.
                PL: Brak odpowiedzi ICMP od switcha przez 3 minuty. Sprawdź zasilanie, uplink i ścieżkę z serwera/proxy Zabbixa.
              tags:
                - tag: component
                  value: icmp
                - tag: scope
                  value: availability
        - uuid: b0d3087ed2644b3db8d3296d9935a72a
          name: 'ICMP: Packet loss'
          type: SIMPLE
          key: icmppingloss
          value_type: FLOAT
          units: '%'
          description: |
            Percentage of lost ICMP packets from the Zabbix server/proxy to the switch.
            PL: Procent utraconych pakietów ICMP z serwera/proxy Zabbixa do switcha.
          tags:
            - tag: component
              value: icmp
            - tag: scope
              value: performance
          triggers:
            - uuid: 5ca56515ca8e44e985758ac91588e7b8
              expression: 'min(/SNMP D-Link DGS-1100-08/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/SNMP D-Link DGS-1100-08/icmppingloss,5m)<100'
              name: 'Performance: High ICMP ping loss (>{$ICMP_LOSS_WARN}%)'
              priority: WARNING
              description: |
                ICMP packet loss from the Zabbix server/proxy to the switch has stayed above {$ICMP_LOSS_WARN}% for 5 minutes. Measures the whole path, not only the switch.
                PL: Utrata pakietów ICMP z serwera/proxy Zabbixa do switcha utrzymuje się powyżej {$ICMP_LOSS_WARN}% przez 5 minut. Mierzy całą ścieżkę, nie tylko switch.
              dependencies:
                - name: 'Availability: Unavailable by ICMP ping'
                  expression: 'max(/SNMP D-Link DGS-1100-08/icmpping,3m)=0'
              tags:
                - tag: component
                  value: icmp
                - tag: scope
                  value: performance
        - uuid: 41d23dd78e404049a1936be7a69f3070
          name: 'ICMP: Response time'
          type: SIMPLE
          key: icmppingsec
          value_type: FLOAT
          units: s
          description: |
            Average ICMP round-trip time from the Zabbix server/proxy.
            PL: Średni czas odpowiedzi ICMP z serwera/proxy Zabbixa.
          tags:
            - tag: component
              value: icmp
            - tag: scope
              value: performance
          triggers:
            - uuid: e2faba5d3b5b451c9040381295cc4cb3
              expression: 'avg(/SNMP D-Link DGS-1100-08/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}'
              name: 'Performance: High ICMP ping response time (>{$ICMP_RESPONSE_TIME_WARN}s)'
              priority: WARNING
              description: |
                Average ICMP response time over 5 minutes exceeds {$ICMP_RESPONSE_TIME_WARN} s. Small switches answer ping from their CPU, so this can indicate CPU load as well as network latency.
                PL: Średni czas odpowiedzi ICMP z 5 minut przekracza {$ICMP_RESPONSE_TIME_WARN} s. Małe switche odpowiadają na ping z CPU, więc może to oznaczać obciążenie CPU albo opóźnienie w sieci.
              dependencies:
                - name: 'Availability: Unavailable by ICMP ping'
                  expression: 'max(/SNMP D-Link DGS-1100-08/icmpping,3m)=0'
                - name: 'Performance: High ICMP ping loss (>{$ICMP_LOSS_WARN}%)'
                  expression: 'min(/SNMP D-Link DGS-1100-08/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/SNMP D-Link DGS-1100-08/icmppingloss,5m)<100'
              tags:
                - tag: component
                  value: icmp
                - tag: scope
                  value: performance
        - uuid: f205ae51605948bc8ca0e4f635330815
          name: 'ICMP: Inbound echo requests'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.5.8.0
          key: net.icmp.in.echos
          units: pps
          description: |
            ICMP echo requests received by the switch (icmpInEchos), per second.
            PL: Żądania ICMP echo odebrane przez switch (icmpInEchos), na sekundę.
          preprocessing:
            - type: CHANGE_PER_SECOND
          tags:
            - tag: component
              value: icmp
            - tag: scope
              value: statistics
        - uuid: 1fe2b13c881b45fe985de9f8f7b381f9
          name: 'ICMP: Outbound echo replies'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.5.14.0
          key: net.icmp.out.echoreps
          units: pps
          description: |
            ICMP echo replies sent by the switch (icmpOutEchoReps), per second.
            PL: Odpowiedzi ICMP echo wysłane przez switch (icmpOutEchoReps), na sekundę.
          preprocessing:
            - type: CHANGE_PER_SECOND
          tags:
            - tag: component
              value: icmp
            - tag: scope
              value: statistics
        - uuid: 88aa41262ae34087aef52c7106bf1a18
          name: 'IP: Datagrams received (management plane)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.4.3.0
          key: net.ip.in.receives
          units: pps
          description: |
            IP datagrams delivered to the switch's own IP stack (ipInReceives). Management traffic only, not switched traffic.
            PL: Datagramy IP dostarczone do własnego stosu IP switcha (ipInReceives). Tylko ruch zarządzający, nie ruch przełączany.
          preprocessing:
            - type: CHANGE_PER_SECOND
          tags:
            - tag: component
              value: network
            - tag: scope
              value: statistics
        - uuid: 6c8549c254c24486ade6438850b835d8
          name: 'SNMP: Packets received'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.11.1.0
          key: net.snmp.in.pkts
          units: pps
          description: |
            SNMP packets received by the agent (snmpInPkts), including Zabbix polling.
            PL: Pakiety SNMP odebrane przez agenta (snmpInPkts), łącznie z odpytywaniem Zabbixa.
          preprocessing:
            - type: CHANGE_PER_SECOND
          tags:
            - tag: component
              value: snmp
            - tag: scope
              value: statistics
        - uuid: 60325922fb48470c91ba0a44cebefac8
          name: 'TCP: Segments received'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.6.10.0
          key: net.tcp.in.segs
          units: segments/s
          description: |
            TCP segments received by the switch management stack (tcpInSegs).
            PL: Segmenty TCP odebrane przez stos zarządzający switcha (tcpInSegs).
          preprocessing:
            - type: CHANGE_PER_SECOND
          tags:
            - tag: component
              value: network
            - tag: scope
              value: statistics
        - uuid: b38c078017594037b8c01603aa7b533a
          name: 'TCP: Segments sent'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.6.11.0
          key: net.tcp.out.segs
          units: segments/s
          description: |
            TCP segments sent by the switch management stack (tcpOutSegs).
            PL: Segmenty TCP wysłane przez stos zarządzający switcha (tcpOutSegs).
          preprocessing:
            - type: CHANGE_PER_SECOND
          tags:
            - tag: component
              value: network
            - tag: scope
              value: statistics
        - uuid: f5e0922b6eee48ec9fce79dcf46b702a
          name: 'UDP: Datagrams received'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.7.1.0
          key: net.udp.in.datagrams
          units: datagrams/s
          description: |
            UDP datagrams delivered to applications on the switch (udpInDatagrams).
            PL: Datagramy UDP dostarczone do aplikacji na switchu (udpInDatagrams).
          preprocessing:
            - type: CHANGE_PER_SECOND
          tags:
            - tag: component
              value: network
            - tag: scope
              value: statistics
        - uuid: 527f2979f91a46b290be389b70d70ba8
          name: 'UDP: Datagrams to closed ports'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.7.4.0
          key: net.udp.no_ports
          units: datagrams/s
          description: |
            UDP datagrams received for a port with no listening application (udpNoPorts). Often broadcasts from the LAN.
            PL: Datagramy UDP na port bez nasłuchującej aplikacji (udpNoPorts). Często broadcasty z sieci LAN.
          preprocessing:
            - type: CHANGE_PER_SECOND
          tags:
            - tag: component
              value: network
            - tag: scope
              value: statistics
          triggers:
            - uuid: 928c9396526747798687f53eb8cddd81
              expression: 'min(/SNMP D-Link DGS-1100-08/net.udp.no_ports, 5m) > {$NET.UDP.NOISE.MAX}'
              name: 'Network: High rate of UDP datagrams to closed ports (>{$NET.UDP.NOISE.MAX}/s)'
              priority: INFO
              description: |
                The switch management IP receives many UDP datagrams for closed ports. Usually broadcast noise (NetBIOS, SSDP, mDNS) or a scanner; high values load the switch CPU.
                PL: IP zarządzające switcha odbiera dużo datagramów UDP na zamknięte porty. Zwykle szum broadcastowy (NetBIOS, SSDP, mDNS) albo skaner; wysokie wartości obciążają CPU switcha.
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: notice
        - uuid: dc96187152624e70bddec371f6aa805c
          name: 'SNMP: Authentication failures'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.11.4.0
          key: snmp.auth.failures
          delay: 5m
          description: |
            SNMP requests with an unknown community within the polling interval (snmpInBadCommunityNames delta). The counter does not record the source IP.
            PL: Zapytania SNMP z nieznanym community w interwale odpytywania (przyrost snmpInBadCommunityNames). Licznik nie zapisuje IP źródła.
          preprocessing:
            - type: SIMPLE_CHANGE
          tags:
            - tag: component
              value: snmp
            - tag: scope
              value: security
          triggers:
            - uuid: 75953e930f534d2498a3b14015f262c0
              expression: 'sum(/SNMP D-Link DGS-1100-08/snmp.auth.failures,1h)>{$SNMP.AUTH.FAIL.MAX}'
              name: 'Security: SNMP authentication failures on {HOST.NAME}'
              opdata: 'Last 5 min: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: |
                The switch received SNMP requests with an unknown community within the last hour (snmpInBadCommunityNames). Typical sources: Zabbix network discovery, scanners, inventory or management tools with a wrong community. The counter has no source IP - use the switch log or port mirroring with tcpdump to find it.
                PL: Switch otrzymał w ciągu ostatniej godziny zapytania SNMP z nieznanym community (snmpInBadCommunityNames). Typowe źródła: discovery Zabbixa, skanery, narzędzia inwentaryzacyjne lub zarządzające ze złym community. Licznik nie zawiera IP źródła - użyj logu switcha albo port mirroringu i tcpdump.
              tags:
                - tag: component
                  value: snmp
                - tag: scope
                  value: security
        - uuid: f0bb029291234addb9d8b60681b0383f
          name: 'System: Contact'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.4.0
          key: system.contact
          delay: 12h
          value_type: CHAR
          description: |
            sysContact configured on the switch.
            PL: sysContact ustawione na switchu.
          inventory_link: CONTACT
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
            - tag: scope
              value: inventory
        - uuid: 97f2a6ea7b454c838c1df8538969f867
          name: 'System: Description'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: system.descr
          delay: 12h
          value_type: CHAR
          description: |
            sysDescr: device model and firmware as reported by the agent.
            PL: sysDescr: model i firmware urządzenia według agenta.
          inventory_link: HARDWARE_FULL
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
            - tag: scope
              value: inventory
        - uuid: fc2adf85194e4f34ae75e1a2d9f50f36
          name: 'System: Location'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.6.0
          key: system.location
          delay: 12h
          value_type: CHAR
          description: |
            sysLocation configured on the switch.
            PL: sysLocation ustawione na switchu.
          inventory_link: LOCATION
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
            - tag: scope
              value: inventory
        - uuid: bac13602b1f6400ca68a9b00411d03b5
          name: 'System: Name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: system.name
          delay: 12h
          value_type: CHAR
          description: |
            sysName configured on the switch.
            PL: sysName ustawione na switchu.
          inventory_link: NAME
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
            - tag: scope
              value: inventory
        - uuid: d80f51050526475e9ca85e1a4577e34a
          name: 'System: Uptime'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: system.uptime
          delay: 5m
          units: uptime
          description: |
            sysUpTime: time since the SNMP agent (re)started. Wraps after about 497 days.
            PL: sysUpTime: czas od (re)startu agenta SNMP. Przekręca się po ok. 497 dniach.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
            - tag: scope
              value: availability
          triggers:
            - uuid: 38b3dc10b2754c4791f49f0e73220fba
              expression: 'last(/SNMP D-Link DGS-1100-08/system.uptime)<10m'
              name: 'System: Device has been restarted (uptime < 10m)'
              priority: WARNING
              description: |
                sysUpTime is below 10 minutes: the switch or its SNMP agent restarted. Known limitation: sysUpTime wraps after about 497 days, which causes a false alert.
                PL: sysUpTime poniżej 10 minut: switch lub jego agent SNMP został zrestartowany. Znane ograniczenie: sysUpTime przekręca się po ok. 497 dniach, co daje fałszywy alarm.
              tags:
                - tag: component
                  value: system
                - tag: scope
                  value: notice
        - uuid: ab79910be6a34f53a16d9c34204fbf93
          name: 'SNMP: Agent availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          description: |
            Availability of the host's SNMP interface as seen by the Zabbix server/proxy.
            PL: Dostępność interfejsu SNMP hosta z punktu widzenia serwera/proxy Zabbixa.
          valuemap:
            name: 'Zabbix host availability'
          tags:
            - tag: component
              value: snmp
            - tag: scope
              value: availability
          triggers:
            - uuid: f34b379e12594f948664302ee0e9c3f6
              expression: 'max(/SNMP D-Link DGS-1100-08/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0'
              name: 'Availability: No SNMP data collection'
              priority: AVERAGE
              description: |
                The Zabbix server/proxy has had no SNMP connectivity to the switch for {$SNMP.TIMEOUT} while ICMP works. Check the SNMP service, community and access lists on the switch.
                PL: Serwer/proxy Zabbixa nie ma łączności SNMP ze switchem od {$SNMP.TIMEOUT}, choć ICMP działa. Sprawdź usługę SNMP, community i listy dostępu na switchu.
              dependencies:
                - name: 'Availability: Unavailable by ICMP ping'
                  expression: 'max(/SNMP D-Link DGS-1100-08/icmpping,3m)=0'
              tags:
                - tag: component
                  value: snmp
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: b75032bb46af43ba9dd7543737b5a36e
          name: 'Network interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3]'
          key: net.if.discovery
          delay: 1h
          filter:
            conditions:
              - macro: '{#IFTYPE}'
                value: ^6$
          lifetime: 30d
          description: |
            Discovers switch interfaces from IF-MIB (ifDescr as {#IFNAME}, ifType as {#IFTYPE}). The filter keeps physical Ethernet ports only.
            PL: Wykrywa interfejsy switcha z IF-MIB (ifDescr jako {#IFNAME}, ifType jako {#IFTYPE}). Filtr zostawia tylko fizyczne porty Ethernet.
          item_prototypes:
            - uuid: 079ef702ee92421a95d764327f11afb6
              name: 'Interface {#IFNAME}: Administrative status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}'
              key: 'net.if.adminstatus[{#IFNAME}]'
              description: |
                Configured port state (ifAdminStatus).
                PL: Skonfigurowany stan portu (ifAdminStatus).
              valuemap:
                name: 'Admin status'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: availability
            - uuid: 565fded31c9c4fdfbff4099d93c0a008
              name: 'Interface {#IFNAME}: Inbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
              key: 'net.if.in.discards[{#IFNAME}]'
              units: pps
              description: |
                Inbound error-free packets dropped by the switch (ifInDiscards): buffers, congestion, VLAN filtering.
                PL: Poprawne pakiety przychodzące odrzucone przez switch (ifInDiscards): bufory, przeciążenie, filtrowanie VLAN.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: health
              trigger_prototypes:
                - uuid: 99198e75cb294c78a2e08c210336480a
                  expression: 'min(/SNMP D-Link DGS-1100-08/net.if.in.discards[{#IFNAME}],5m)>{$IF.DISCARDS.MAX:"{#IFNAME}"}'
                  name: '{#IFNAME}: High inbound discard rate'
                  priority: WARNING
                  description: |
                    The switch drops more than {$IF.DISCARDS.MAX} error-free packets per second on this port for 5 minutes: congestion, small buffers or frames filtered by VLAN.
                    PL: Switch odrzuca na tym porcie ponad {$IF.DISCARDS.MAX} poprawnych pakietów na sekundę przez 5 minut: przeciążenie, małe bufory lub ramki filtrowane przez VLAN.
                  tags:
                    - tag: component
                      value: network
                    - tag: interface
                      value: '{#IFNAME}'
                    - tag: scope
                      value: health
            - uuid: 92ae407b0a8546a7b2ce9c6f2b669d2b
              name: 'Interface {#IFNAME}: Inbound errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
              key: 'net.if.in.errors[{#IFNAME}]'
              delay: 5m
              units: errors/s
              description: |
                Inbound packets with errors per second (ifInErrors). Usually cabling, duplex mismatch or a faulty NIC.
                PL: Przychodzące pakiety z błędami na sekundę (ifInErrors). Zwykle okablowanie, niezgodność duplex lub wadliwa karta.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: health
            - uuid: 3b09c878920c47db8612fd00e9b262fa
              name: 'Interface {#IFNAME}: Inbound non-unicast packets'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.12.{#SNMPINDEX}'
              key: 'net.if.in.nucast[{#IFNAME}]'
              units: pps
              description: |
                Inbound broadcast + multicast packets per second (ifInNUcastPkts, deprecated in IF-MIB; verify the switch returns non-zero values).
                PL: Przychodzące pakiety broadcast + multicast na sekundę (ifInNUcastPkts, przestarzałe w IF-MIB; sprawdź, czy switch zwraca wartości niezerowe).
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: performance
              trigger_prototypes:
                - uuid: c2980cbee9c6476db717c397f7055e92
                  expression: 'min(/SNMP D-Link DGS-1100-08/net.if.in.nucast[{#IFNAME}],5m)>{$IF.BCAST.MAX.WARN:"{#IFNAME}"}'
                  name: '{#IFNAME}: Potential broadcast/multicast storm'
                  priority: WARNING
                  description: |
                    Inbound broadcast/multicast exceeds {$IF.BCAST.MAX.WARN} pps for 5 minutes. Possible loop, faulty device or multicast flood.
                    PL: Broadcast/multicast na wejściu przekracza {$IF.BCAST.MAX.WARN} pps przez 5 minut. Możliwa pętla, wadliwe urządzenie lub zalew multicastu.
                  tags:
                    - tag: component
                      value: network
                    - tag: interface
                      value: '{#IFNAME}'
                    - tag: scope
                      value: health
            - uuid: d29eb749538446b8b8aaf15da783e85c
              name: 'Interface {#IFNAME}: Inbound unicast packets'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.11.{#SNMPINDEX}'
              key: 'net.if.in.ucast[{#IFNAME}]'
              units: pps
              description: |
                Inbound unicast packets per second (ifInUcastPkts).
                PL: Przychodzące pakiety unicast na sekundę (ifInUcastPkts).
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: performance
            - uuid: 802afea6aa4f48e08b2fa4fc17370dd5
              name: 'Interface {#IFNAME}: Inbound unknown protocol packets'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.15.{#SNMPINDEX}'
              key: 'net.if.in.unknown_protos[{#IFNAME}]'
              units: pps
              description: |
                Frames of a protocol the switch does not handle (ifInUnknownProtos).
                PL: Ramki protokołu, którego switch nie obsługuje (ifInUnknownProtos).
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: health
              trigger_prototypes:
                - uuid: 9be91f404ad041c1a61f8352e0dadb61
                  expression: 'min(/SNMP D-Link DGS-1100-08/net.if.in.unknown_protos[{#IFNAME}],5m)>{$IF.UNKNOWN.MAX:"{#IFNAME}"}'
                  name: '{#IFNAME}: Unknown protocol frames received'
                  priority: INFO
                  description: |
                    The port receives frames of protocols the switch does not handle (e.g. LLDP/CDP from other vendors, IPv6, unexpected tagged frames). Investigate only if it is new or growing.
                    PL: Port odbiera ramki protokołów, których switch nie obsługuje (np. LLDP/CDP innych producentów, IPv6, nieoczekiwane ramki tagowane). Badaj tylko, jeśli to nowe zjawisko lub rośnie.
                  tags:
                    - tag: component
                      value: network
                    - tag: interface
                      value: '{#IFNAME}'
                    - tag: scope
                      value: notice
            - uuid: 324dfd48a03942538d0079ccace724e2
              name: 'Interface {#IFNAME}: Inbound utilization'
              type: CALCULATED
              key: 'net.if.in.util[{#IFNAME}]'
              value_type: FLOAT
              units: '%'
              params: '(last(//net.if.in[{#IFNAME}]) * 100) / (last(//net.if.speed[{#IFNAME}]) + (last(//net.if.speed[{#IFNAME}])=0))'
              description: |
                Inbound bandwidth utilization in % of the negotiated speed; 0 when the link is down.
                PL: Wykorzystanie pasma przychodzącego w % wynegocjowanej prędkości; 0 przy braku linku.
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: capacity
              trigger_prototypes:
                - uuid: 2c6936a8717d49ad9736b8c2f89b1bb2
                  expression: 'min(/SNMP D-Link DGS-1100-08/net.if.in.util[{#IFNAME}],5m)>{$IF.UTIL.MAX:"{#IFNAME}"}'
                  name: '{#IFNAME}: High inbound bandwidth utilization'
                  priority: WARNING
                  description: |
                    Inbound utilization has stayed above {$IF.UTIL.MAX}% of the link speed for 5 minutes.
                    PL: Wykorzystanie pasma przychodzącego utrzymuje się powyżej {$IF.UTIL.MAX}% prędkości łącza przez 5 minut.
                  tags:
                    - tag: component
                      value: network
                    - tag: interface
                      value: '{#IFNAME}'
                    - tag: scope
                      value: capacity
            - uuid: fc61e5da3b0a498d8fa15bbc8a051efe
              name: 'Interface {#IFNAME}: Incoming traffic'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'net.if.in[{#IFNAME}]'
              units: bps
              description: |
                Inbound traffic from the 64-bit counter ifHCInOctets, in bits per second.
                PL: Ruch przychodzący z 64-bitowego licznika ifHCInOctets, w bitach na sekundę.
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: performance
            - uuid: 77d1110cb1c54aef9ec27cdbc51665e2
              name: 'Interface {#IFNAME}: MAC Address'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.6.{#SNMPINDEX}'
              key: 'net.if.mac[{#IFNAME}]'
              delay: 24h
              value_type: CHAR
              description: |
                Port MAC address (ifPhysAddress).
                PL: Adres MAC portu (ifPhysAddress).
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: inventory
            - uuid: a3df50ec299d43c9b731dc7f64b16c7c
              name: 'Interface {#IFNAME}: MTU'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.4.{#SNMPINDEX}'
              key: 'net.if.mtu[{#IFNAME}]'
              delay: 12h
              description: |
                Port MTU (ifMtu).
                PL: MTU portu (ifMtu).
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: inventory
            - uuid: f06b78b17e344a88a0e24a77abc34078
              name: 'Interface {#IFNAME}: Outbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}'
              key: 'net.if.out.discards[{#IFNAME}]'
              units: pps
              description: |
                Outbound error-free packets dropped by the switch (ifOutDiscards): buffers, congestion.
                PL: Poprawne pakiety wychodzące odrzucone przez switch (ifOutDiscards): bufory, przeciążenie.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: health
            - uuid: 7f997a9a98d644b19bed2f26d071f8d2
              name: 'Interface {#IFNAME}: Outbound errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
              key: 'net.if.out.errors[{#IFNAME}]'
              delay: 5m
              units: errors/s
              description: |
                Outbound packets with errors per second (ifOutErrors). Usually cabling, duplex mismatch or a faulty NIC.
                PL: Wychodzące pakiety z błędami na sekundę (ifOutErrors). Zwykle okablowanie, niezgodność duplex lub wadliwa karta.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: health
            - uuid: f3bd454460d2455b87a3ed1371b00f5f
              name: 'Interface {#IFNAME}: Outbound non-unicast packets'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.18.{#SNMPINDEX}'
              key: 'net.if.out.nucast[{#IFNAME}]'
              units: pps
              description: |
                Outbound broadcast + multicast packets per second (ifOutNUcastPkts, deprecated in IF-MIB; verify the switch returns non-zero values).
                PL: Wychodzące pakiety broadcast + multicast na sekundę (ifOutNUcastPkts, przestarzałe w IF-MIB; sprawdź, czy switch zwraca wartości niezerowe).
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: performance
            - uuid: be69157c8b984759bb5dfd79b356b4e5
              name: 'Interface {#IFNAME}: Outbound unicast packets'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.17.{#SNMPINDEX}'
              key: 'net.if.out.ucast[{#IFNAME}]'
              units: pps
              description: |
                Outbound unicast packets per second (ifOutUcastPkts).
                PL: Wychodzące pakiety unicast na sekundę (ifOutUcastPkts).
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: performance
            - uuid: e3da6c44c29d4ce7a73d5e0109ff1c3a
              name: 'Interface {#IFNAME}: Outbound utilization'
              type: CALCULATED
              key: 'net.if.out.util[{#IFNAME}]'
              value_type: FLOAT
              units: '%'
              params: '(last(//net.if.out[{#IFNAME}]) * 100) / (last(//net.if.speed[{#IFNAME}]) + (last(//net.if.speed[{#IFNAME}])=0))'
              description: |
                Outbound bandwidth utilization in % of the negotiated speed; 0 when the link is down.
                PL: Wykorzystanie pasma wychodzącego w % wynegocjowanej prędkości; 0 przy braku linku.
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: capacity
              trigger_prototypes:
                - uuid: ddadaaeaa40b4789be4cedd7fe06fa57
                  expression: 'min(/SNMP D-Link DGS-1100-08/net.if.out.util[{#IFNAME}],5m)>{$IF.UTIL.MAX:"{#IFNAME}"}'
                  name: '{#IFNAME}: High outbound bandwidth utilization'
                  priority: WARNING
                  description: |
                    Outbound utilization has stayed above {$IF.UTIL.MAX}% of the link speed for 5 minutes.
                    PL: Wykorzystanie pasma wychodzącego utrzymuje się powyżej {$IF.UTIL.MAX}% prędkości łącza przez 5 minut.
                  tags:
                    - tag: component
                      value: network
                    - tag: interface
                      value: '{#IFNAME}'
                    - tag: scope
                      value: capacity
            - uuid: 9f6e0f5151c9421eb1f9ffd8a8c41aed
              name: 'Interface {#IFNAME}: Outgoing traffic'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'net.if.out[{#IFNAME}]'
              units: bps
              description: |
                Outbound traffic from the 64-bit counter ifHCOutOctets, in bits per second.
                PL: Ruch wychodzący z 64-bitowego licznika ifHCOutOctets, w bitach na sekundę.
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: performance
            - uuid: 883fed19430e46e0bbd8b300d49387ae
              name: 'Interface {#IFNAME}: Interface speed'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.5.{#SNMPINDEX}'
              key: 'net.if.speed[{#IFNAME}]'
              delay: 5m
              units: bps
              description: |
                Negotiated port speed (ifSpeed, 32-bit, max 4.29 Gbps).
                PL: Wynegocjowana prędkość portu (ifSpeed, 32-bit, maks. 4,29 Gbps).
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: inventory
            - uuid: 5abb7a545876484cb4f455349d6948cd
              name: 'Interface {#IFNAME}: Operational status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.status[{#IFNAME}]'
              description: |
                Actual link state (ifOperStatus).
                PL: Rzeczywisty stan łącza (ifOperStatus).
              valuemap:
                name: 'Interface Status'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: availability
              trigger_prototypes:
                - uuid: 431607605ed54e1c9e4a23ad7873053a
                  expression: 'changecount(/SNMP D-Link DGS-1100-08/net.if.status[{#IFNAME}],15m)>{$IF.FLAP.MAX:"{#IFNAME}"}'
                  name: '{#IFNAME}: Link flapping'
                  priority: AVERAGE
                  description: |
                    The link state changed more than {$IF.FLAP.MAX} times within 15 minutes. Polling is every minute, so flaps faster than that are not visible. Check the cable, connectors and the connected device.
                    PL: Stan łącza zmienił się ponad {$IF.FLAP.MAX} razy w ciągu 15 minut. Odczyt jest co minutę, więc szybszych przeskoków nie widać. Sprawdź kabel, złącza i podłączone urządzenie.
                  tags:
                    - tag: component
                      value: network
                    - tag: interface
                      value: '{#IFNAME}'
                    - tag: scope
                      value: health
          trigger_prototypes:
            - uuid: cac6e4d3cb6f4559a62bf27d995eb850
              expression: |
                min(/SNMP D-Link DGS-1100-08/net.if.in.errors[{#IFNAME}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
                or
                min(/SNMP D-Link DGS-1100-08/net.if.out.errors[{#IFNAME}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}
              name: '{#IFNAME}: High error rate'
              priority: WARNING
              description: |
                Inbound or outbound errors on the port exceed {$IF.ERRORS.WARN} per second. Check the cable, patch panel, duplex settings and the connected device NIC.
                PL: Błędy wejściowe lub wyjściowe na porcie przekraczają {$IF.ERRORS.WARN} na sekundę. Sprawdź kabel, patch panel, ustawienia duplex i kartę sieciową podłączonego urządzenia.
              manual_close: 'YES'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: health
            - uuid: 2fde8998fd9044b7a22ba3ffb95b4272
              expression: |
                {$IFCONTROL:"{#IFNAME}"}=1
                and
                last(/SNMP D-Link DGS-1100-08/net.if.status[{#IFNAME}])=2
                and
                last(/SNMP D-Link DGS-1100-08/net.if.adminstatus[{#IFNAME}])=1
              name: '{#IFNAME}: Interface is down'
              priority: AVERAGE
              description: |
                The port is administratively enabled but has no link. Set {$IFCONTROL:"<port>"}=0 on the host for ports whose state does not matter (e.g. workstations switched off at night).
                PL: Port jest włączony administracyjnie, ale nie ma linku. Ustaw na hoście {$IFCONTROL:"<port>"}=0 dla portów, których stan nie ma znaczenia (np. stacje wyłączane na noc).
              manual_close: 'YES'
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: availability
            - uuid: 2318f8bb79524d45bec352e07faef53c
              expression: |
                last(/SNMP D-Link DGS-1100-08/net.if.speed[{#IFNAME}]) < {$IF.SPEED.MIN:"{#IFNAME}"}
                and
                last(/SNMP D-Link DGS-1100-08/net.if.status[{#IFNAME}]) = 1
              name: '{#IFNAME}: Link speed lower than expected'
              priority: WARNING
              description: |
                The link negotiated a lower speed than {$IF.SPEED.MIN} bps. Often a damaged cable pair. For devices that are 100M by design set {$IF.SPEED.MIN:"<port>"}=100000000 on the host.
                PL: Łącze wynegocjowało prędkość niższą niż {$IF.SPEED.MIN} bps. Często uszkodzona para w kablu. Dla urządzeń 100M z natury ustaw na hoście {$IF.SPEED.MIN:"<port>"}=100000000.
              tags:
                - tag: component
                  value: network
                - tag: interface
                  value: '{#IFNAME}'
                - tag: scope
                  value: health
          graph_prototypes:
            - uuid: 69125abb66e74fb19c8f868115990d93
              name: '{#IFNAME}: Traffic'
              yaxismax: '0'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 1A7C11
                  calc_fnc: ALL
                  item:
                    host: 'SNMP D-Link DGS-1100-08'
                    key: 'net.if.in[{#IFNAME}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: '274482'
                  calc_fnc: ALL
                  item:
                    host: 'SNMP D-Link DGS-1100-08'
                    key: 'net.if.out[{#IFNAME}]'
      tags:
        - tag: service
          value: switch
        - tag: vendor
          value: d-link
      macros:
        - macro: '{$ICMP_LOSS_WARN}'
          value: '20'
          description: 'ICMP packet loss warning threshold (%). PL: Próg ostrzegania o utracie pakietów ICMP (%).'
        - macro: '{$ICMP_RESPONSE_TIME_WARN}'
          value: '0.15'
          description: 'ICMP response time warning threshold (seconds). PL: Próg ostrzegania o czasie odpowiedzi ICMP (sekundy).'
        - macro: '{$IF.BCAST.MAX.WARN}'
          value: '500'
          description: 'Inbound broadcast/multicast packets per port above which a storm is suspected (pps). Context: {#IFNAME}. PL: Próg pakietów broadcast/multicast na porcie, powyżej którego podejrzewany jest sztorm (pps). Kontekst: {#IFNAME}.'
        - macro: '{$IF.DISCARDS.MAX}'
          value: '10'
          description: 'Inbound discarded packets per second on a port. Initial value, tune to baseline. Context: {#IFNAME}. PL: Odrzucone pakiety wejściowe na sekundę na porcie. Wartość startowa, dostroić do bazy. Kontekst: {#IFNAME}.'
        - macro: '{$IF.ERRORS.WARN}'
          value: '2'
          description: 'Inbound/outbound errors per second on a port. Context: {#IFNAME}. PL: Błędy na sekundę (wejście/wyjście) na porcie. Kontekst: {#IFNAME}.'
        - macro: '{$IF.FLAP.MAX}'
          value: '3'
          description: 'Port status changes within 15 minutes regarded as flapping. Context: {#IFNAME}. PL: Liczba zmian stanu portu w ciągu 15 minut uznawana za flapping. Kontekst: {#IFNAME}.'
        - macro: '{$IF.SPEED.MIN}'
          value: '1000000000'
          description: 'Minimum expected link speed (bps). Context: {#IFNAME}, e.g. 100000000 for 100M devices. PL: Minimalna oczekiwana prędkość łącza (bps). Kontekst: {#IFNAME}, np. 100000000 dla urządzeń 100M.'
        - macro: '{$IF.UNKNOWN.MAX}'
          value: '5'
          description: 'Inbound unknown-protocol frames per second on a port. Context: {#IFNAME}. PL: Ramki nieznanych protokołów na sekundę na porcie. Kontekst: {#IFNAME}.'
        - macro: '{$IF.UTIL.MAX}'
          value: '85'
          description: 'Port bandwidth utilization warning threshold (%). Context: {#IFNAME}. PL: Próg ostrzegania o wykorzystaniu pasma portu (%). Kontekst: {#IFNAME}.'
        - macro: '{$IFCONTROL}'
          value: '1'
          description: '1 = alert when the port goes down, 0 = ignore. Context: {#IFNAME}. PL: 1 = alarm przy spadku portu, 0 = ignoruj. Kontekst: {#IFNAME}.'
        - macro: '{$NET.UDP.NOISE.MAX}'
          value: '50'
          description: 'UDP datagrams to closed ports on the switch management IP (per second). PL: Próg datagramów UDP na zamknięte porty IP zarządzającego switcha (na sekundę).'
        - macro: '{$SNMP.AUTH.FAIL.MAX}'
          value: '0'
          description: 'Allowed SNMP authentication failures per hour. PL: Dopuszczalna liczba błędów uwierzytelnienia SNMP na godzinę.'
        - macro: '{$SNMP.TIMEOUT}'
          value: 5m
          description: 'Time without SNMP connectivity before alerting. PL: Czas braku łączności SNMP przed alarmem.'
