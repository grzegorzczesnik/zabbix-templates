            - uuid: 99f14146d44a4411b93465c273ee3ea6
              name: 'RAID {#RAIDID}: Rebuilding Progress'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.1.1.2.1.2.1.6.{#SNMPINDEX}'
              key: 'qnap.raid.rebuild.progress[{#SNMPINDEX}]'
              delay: 5m
              units: '%'
              description: |
                EN: Rebuild progress of RAID group {#RAIDID} in percent, meaningful while the group is rebuilding after a drive replacement.
                PL: Postęp odbudowy grupy RAID {#RAIDID} w procentach; ma znaczenie, gdy grupa jest odbudowywana po wymianie dysku.
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
