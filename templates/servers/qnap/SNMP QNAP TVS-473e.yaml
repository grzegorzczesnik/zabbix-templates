                  name: 'Fan {#FANID}: Speed is too low or stopped ({ITEM.VALUE1}) on {HOST.NAME}'
                  priority: HIGH
                  description: |
                    EN: Fan {#FANID} is running below {$FAN.SPEED.MIN} RPM or has stopped. Check the fan and clean the dust; a stopped fan quickly raises the drive and system temperature.
                    PL: Wentylator {#FANID} obraca się wolniej niż {$FAN.SPEED.MIN} RPM albo stanął. Sprawdź wentylator i usuń kurz; zatrzymany wentylator szybko podnosi temperaturę dysków i systemu.
