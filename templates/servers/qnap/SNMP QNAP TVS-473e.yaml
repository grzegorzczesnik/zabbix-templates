zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: a3394d4c34844c4882c9a4c43efc1b1a
      template: 'SNMP QNAP TVS-473e'
      name: 'SNMP QNAP TVS-473e'
      description: |
        EN: Monitoring of a QNAP TVS-473e NAS (QTS) over SNMP: system health (CPU, memory, temperatures, fans, uptime), storage (physical drives with SMART, RAID groups, logical volumes and their performance), network interfaces, external USB/eSATA drives, QTS services and SNMP traps split by QTS event level (Error, Warning, other). Traps require snmptrapd with zabbix_trap_handler.sh on the Zabbix server or proxy and QTS trap settings pointing to it - see README. Thresholds are set in template macros.
        PL: Monitoring NAS-a QNAP TVS-473e (QTS) przez SNMP: stan systemu (CPU, pamięć, temperatury, wentylatory, czas pracy), pamięć masowa (dyski fizyczne ze SMART, grupy RAID, wolumeny logiczne i ich wydajność), interfejsy sieciowe, dyski zewnętrzne USB/eSATA, usługi QTS oraz pułapki SNMP rozdzielone według poziomu zdarzenia QTS (Error, Warning, pozostałe). Pułapki wymagają snmptrapd z zabbix_trap_handler.sh na serwerze lub proxy Zabbix oraz ustawienia pułapek w QTS na ich adres - patrz README. Progi ustawia się w makrach szablonu.
      vendor:
        name: 'Grzegorz Cześnik - grzegorz@net59.pl'
        version: 3.0.0
      groups:
        - name: Templates
      items:
        - uuid: 8d9a89dabcf04643b43a773d88ca55b9
          name: 'ICMP Ping'
          type: SIMPLE
          key: icmpping
          description: |
            EN: ICMP ping response from the NAS, checked by the Zabbix server or proxy: 1 = responds, 0 = no response.
            PL: Odpowiedź NAS-a na ping ICMP, sprawdzana przez serwer lub proxy Zabbix: 1 = odpowiada, 0 = brak odpowiedzi.
          valuemap:
            name: 'Service State'
          tags:
            - tag: component
              value: network
            - tag: scope
              value: availability
          triggers:
            - uuid: 911e37771d4d4cd1ba91dc66b7542ff1
              expression: 'max(/SNMP QNAP TVS-473e/icmpping,3m)=0'
              name: 'Host is unavailable'
              priority: DISASTER
              description: |
                EN: The NAS has not responded to ICMP ping for the last 3 minutes. Check the power supply and the network connection.
                PL: NAS nie odpowiada na ping ICMP przez ostatnie 3 minuty. Sprawdź zasilanie i podłączenie do sieci.
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: availability
        - uuid: 0d270fdc199849bfbc34a26ac6c68858
          name: 'Network: Established TCP Connections'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.6.9.0
          key: net.tcp.established
          description: |
            EN: Number of currently established TCP connections on the NAS (tcpCurrEstab). A sudden rise may point to heavy client load or a connection leak.
            PL: Liczba aktualnie nawiązanych połączeń TCP na NAS-ie (tcpCurrEstab). Nagły wzrost może wskazywać na duże obciążenie przez klientów albo wyciek połączeń.
          tags:
            - tag: component
              value: network
            - tag: scope
              value: performance
        - uuid: 4c9624861fb3445ba1cf89794209f755
          name: 'Service Status: SMB (File Sharing)'
          type: SIMPLE
          key: 'net.tcp.service[tcp,,445]'
          description: |
            EN: Availability of the SMB/CIFS file sharing service on TCP port 445, checked by the Zabbix server or proxy: 1 = up, 0 = down.
            PL: Dostępność usługi udostępniania plików SMB/CIFS na porcie TCP 445, sprawdzana przez serwer lub proxy Zabbix: 1 = działa, 0 = nie działa.
          valuemap:
            name: 'Service State'
          tags:
            - tag: component
              value: application
            - tag: scope
              value: availability
          triggers:
            - uuid: c9aa728c37dc4fcc80e1374adc51bbef
              expression: 'max(/SNMP QNAP TVS-473e/net.tcp.service[tcp,,445],3m)=0'
              name: 'SMB Service is Down on {HOST.NAME}'
              opdata: 'Current state: {ITEM.VALUE}'
              priority: HIGH
              description: |
                EN: The SMB/CIFS file sharing service has not responded on TCP port 445 for the last 3 minutes. Possible causes: the service was stopped in QTS, a firewall blocks port 445, or the NAS is overloaded. Check in QTS: Control Panel - Network & File Services - Win/Mac/NFS/WebDAV.
                PL: Usługa udostępniania plików SMB/CIFS nie odpowiada na porcie TCP 445 przez ostatnie 3 minuty. Możliwe przyczyny: usługa została zatrzymana w QTS, firewall blokuje port 445 albo NAS jest przeciążony. Sprawdź w QTS: Panel sterowania - Usługi sieciowe i plików - Win/Mac/NFS/WebDAV.
              dependencies:
                - name: 'SNMP Agent is unreachable on {HOST.NAME}'
                  expression: 'max(/SNMP QNAP TVS-473e/zabbix[host,snmp,available],5m)=0'
              tags:
                - tag: component
                  value: application
                - tag: scope
                  value: availability
        - uuid: 0b96ee5a3cb04c5ca5c16113972076c0
          name: 'Service Status: QTS Web Interface (Port {$QNAP.WEB.PORT})'
          type: SIMPLE
          key: 'net.tcp.service[tcp,,{$QNAP.WEB.PORT}]'
          description: |
            EN: Availability of the QTS web interface on TCP port {$QNAP.WEB.PORT}, checked by the Zabbix server or proxy: 1 = up, 0 = down.
            PL: Dostępność interfejsu WWW QTS na porcie TCP {$QNAP.WEB.PORT}, sprawdzana przez serwer lub proxy Zabbix: 1 = działa, 0 = nie działa.
          valuemap:
            name: 'Service State'
          tags:
            - tag: component
              value: application
            - tag: scope
              value: availability
          triggers:
            - uuid: ebcad11b61384ef9a8d8572199d4af6a
              expression: 'max(/SNMP QNAP TVS-473e/net.tcp.service[tcp,,{$QNAP.WEB.PORT}],3m)=0'
              name: 'QTS Web Interface is down on {HOST.NAME}'
              opdata: 'Current state: {ITEM.VALUE}'
              priority: AVERAGE
              description: |
                EN: The QTS web interface has not responded on TCP port {$QNAP.WEB.PORT} for the last 3 minutes. Check whether the service was stopped or the port is blocked by a firewall.
                PL: Interfejs WWW QTS nie odpowiada na porcie TCP {$QNAP.WEB.PORT} przez ostatnie 3 minuty. Sprawdź, czy usługa nie została zatrzymana albo czy port nie jest blokowany przez firewall.
              dependencies:
                - name: 'Host is unavailable'
                  expression: 'max(/SNMP QNAP TVS-473e/icmpping,3m)=0'
                - name: 'SNMP Agent is unreachable on {HOST.NAME}'
                  expression: 'max(/SNMP QNAP TVS-473e/zabbix[host,snmp,available],5m)=0'
              tags:
                - tag: component
                  value: application
                - tag: scope
                  value: availability
        - uuid: c19843af075043eb9bd45ce9ed4e1315
          name: 'CPU Usage'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.24681.1.2.1.0
          key: qnap.cpu.util
          value_type: FLOAT
          units: '%'
          description: |
            EN: Overall CPU utilization of the NAS in percent, read from the QNAP private MIB as text; the number is extracted in preprocessing. Alert threshold: {$CPU.UTIL.CRIT}% as a 10-minute average.
            PL: Całkowite wykorzystanie procesora NAS-a w procentach, odczytywane z prywatnego MIB QNAP jako tekst; liczba jest wyciągana w preprocessingu. Próg alarmu: {$CPU.UTIL.CRIT}% jako średnia z 10 minut.
          preprocessing:
            - type: REGEX
              parameters:
                - '^([0-9.]+)'
                - \1
              error_handler: DISCARD_VALUE
          tags:
            - tag: component
              value: cpu
            - tag: scope
              value: performance
          triggers:
            - uuid: b9169ac83b6944a38d9f79223153af9c
              expression: 'nodata(/SNMP QNAP TVS-473e/qnap.cpu.util,10m)=1'
              name: 'CPU Usage data is not responding (No data) on {HOST.NAME}'
              priority: AVERAGE
              description: |
                EN: No CPU utilization data for the last 10 minutes. The SNMP service in QTS may hang because of extreme load or lack of memory.
                PL: Brak danych o wykorzystaniu procesora przez ostatnie 10 minut. Usługa SNMP w QTS mogła się zawiesić z powodu skrajnego obciążenia albo braku pamięci.
              manual_close: 'YES'
              dependencies:
                - name: 'Host is unavailable'
                  expression: 'max(/SNMP QNAP TVS-473e/icmpping,3m)=0'
                - name: 'SNMP Agent is unreachable on {HOST.NAME}'
                  expression: 'max(/SNMP QNAP TVS-473e/zabbix[host,snmp,available],5m)=0'
              tags:
                - tag: component
                  value: cpu
                - tag: scope
                  value: availability
            - uuid: 884ae34643ad423b84f53bc31a5107e6
              expression: 'avg(/SNMP QNAP TVS-473e/qnap.cpu.util,10m) > {$CPU.UTIL.CRIT}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'avg(/SNMP QNAP TVS-473e/qnap.cpu.util,10m) < ({$CPU.UTIL.CRIT}-10)'
              name: 'High CPU utilization for 10 minutes on {HOST.NAME}'
              priority: WARNING
              description: |
                EN: Average CPU utilization has been above {$CPU.UTIL.CRIT}% for the last 10 minutes. Possible causes: heavy I/O, backup jobs, RAID rebuilding or media indexing. If it repeats regularly, use Resource Monitor in QTS to find the process.
                PL: Średnie wykorzystanie procesora przekracza {$CPU.UTIL.CRIT}% przez ostatnie 10 minut. Możliwe przyczyny: intensywne operacje I/O, zadania kopii zapasowej, odbudowa RAID albo indeksowanie multimediów. Jeśli powtarza się regularnie, znajdź proces w Monitorze zasobów w QTS.
              tags:
                - tag: component
                  value: cpu
                - tag: scope
                  value: performance
        - uuid: d2045ec66f9b472fb3e13560f99375a3
          name: 'System: Last SNMP trap (other)'
          type: SNMP_TRAP
          key: snmptrap.fallback
          value_type: TEXT
          description: |
            EN: Last SNMP trap from the NAS that was not matched by the Error and Warning items: QTS Information events (if enabled in QTS), legacy NAS-MIB traps (enterprise 24681) and unknown traps. The value is the full trap text.
            PL: Ostatnia pułapka SNMP z NAS-a niedopasowana przez itemy Error i Warning: zdarzenia QTS poziomu Information (jeśli włączone w QTS), starsze pułapki NAS-MIB (przedsiębiorstwo 24681) i nieznane pułapki. Wartość to pełny tekst pułapki.
          tags:
            - tag: component
              value: system
            - tag: scope
              value: health
          triggers:
            - uuid: 30b2c013c4b84202aca66d96f435f575
              expression: 'length(last(/SNMP QNAP TVS-473e/snmptrap.fallback))>0'
              recovery_mode: NONE
              name: 'QNAP SNMP trap (other) on {HOST.NAME}'
              event_name: 'QNAP SNMP trap (other): {{ITEM.LASTVALUE}.regsub("10[1-3][.]0 = \"(.*)\"", \1)}'
              opdata: '{ITEM.LASTVALUE}'
              priority: INFO
              description: |
                EN: The NAS sent an SNMP trap that is not an Error or Warning event (QTS Information event, legacy or unknown trap). The event name shows the QTS message if present; the full trap text is in Operational data and in the "System: Last SNMP trap (other)" item. Each trap creates exactly one problem; close it manually after review.
                PL: NAS wysłał pułapkę SNMP, która nie jest zdarzeniem Error ani Warning (zdarzenie QTS Information, starsza lub nieznana pułapka). Nazwa zdarzenia pokazuje komunikat QTS, jeśli jest; pełny tekst pułapki jest w Operational data i w itemie "System: Last SNMP trap (other)". Każda pułapka tworzy dokładnie jeden problem; zamknij go ręcznie po sprawdzeniu.
              type: MULTIPLE
              manual_close: 'YES'
              tags:
                - tag: component
                  value: system
                - tag: qts_module
                  value: '{{ITEM.VALUE}.regsub("10[1-3][.]0 = \"[[]([^]]+)[]]", \1)}'
                - tag: scope
                  value: health
        - uuid: 7257b08f15a34550b146a1e29141a46a
          name: 'System: Last SNMP trap (Warning)'
          type: SNMP_TRAP
          key: 'snmptrap["55062\.1\.12\.2\.0\.2\b"]'
          value_type: TEXT
          description: |
            EN: Last QTS event of Warning level received as an SNMP trap (QTS-MIB eventWarning, trap OID 1.3.6.1.4.1.55062.1.12.2.0.2 after SNMPv1-to-v2 conversion). The value is the full trap text; the event message is in variable 1.3.6.1.4.1.55062.1.12.1.102.0.
            PL: Ostatnie zdarzenie QTS poziomu Warning odebrane jako pułapka SNMP (QTS-MIB eventWarning, OID pułapki 1.3.6.1.4.1.55062.1.12.2.0.2 po konwersji SNMPv1 na v2). Wartość to pełny tekst pułapki; treść zdarzenia jest w zmiennej 1.3.6.1.4.1.55062.1.12.1.102.0.
          tags:
            - tag: component
              value: system
            - tag: scope
              value: health
          triggers:
            - uuid: 3f2b9051d47b4556877ee15501252349
              expression: 'length(last(/SNMP QNAP TVS-473e/snmptrap["55062\.1\.12\.2\.0\.2\b"]))>0'
              recovery_mode: NONE
              name: 'QNAP warning on {HOST.NAME}'
              event_name: 'QNAP warning: {{ITEM.LASTVALUE}.regsub("102[.]0 = \"(.*)\"", \1)}'
              priority: WARNING
              description: |
                EN: QTS reported a Warning level event (SNMP trap eventWarning). The event name shows the QTS message; the full trap is in the "System: Last SNMP trap (Warning)" item. Check the QTS system log. Each trap creates exactly one problem; the problem does not close automatically - close it manually after review.
                PL: QTS zgłosił zdarzenie poziomu Warning (pułapka SNMP eventWarning). Nazwa zdarzenia pokazuje komunikat QTS; pełna pułapka jest w itemie "System: Last SNMP trap (Warning)". Sprawdź dziennik systemowy QTS. Każda pułapka tworzy dokładnie jeden problem; problem nie zamyka się sam - zamknij go ręcznie po sprawdzeniu.
              type: MULTIPLE
              manual_close: 'YES'
              tags:
                - tag: component
                  value: system
                - tag: qts_module
                  value: '{{ITEM.VALUE}.regsub("102[.]0 = \"[[]([^]]+)[]]", \1)}'
                - tag: scope
                  value: health
        - uuid: 2f9b27eb6ac643f181e882c3beeb1120
          name: 'System: Last SNMP trap (Error)'
          type: SNMP_TRAP
          key: 'snmptrap["55062\.1\.12\.2\.0\.4\b"]'
          value_type: TEXT
          description: |
            EN: Last QTS event of Error level received as an SNMP trap (QTS-MIB eventError, trap OID 1.3.6.1.4.1.55062.1.12.2.0.4 after SNMPv1-to-v2 conversion). The value is the full trap text; the event message is in variable 1.3.6.1.4.1.55062.1.12.1.103.0.
            PL: Ostatnie zdarzenie QTS poziomu Error odebrane jako pułapka SNMP (QTS-MIB eventError, OID pułapki 1.3.6.1.4.1.55062.1.12.2.0.4 po konwersji SNMPv1 na v2). Wartość to pełny tekst pułapki; treść zdarzenia jest w zmiennej 1.3.6.1.4.1.55062.1.12.1.103.0.
          tags:
            - tag: component
              value: system
            - tag: scope
              value: health
          triggers:
            - uuid: d2dab7e35b4b4f949acb2a71d7aa6d90
              expression: 'length(last(/SNMP QNAP TVS-473e/snmptrap["55062\.1\.12\.2\.0\.4\b"]))>0'
              recovery_mode: NONE
              name: 'QNAP error on {HOST.NAME}'
              event_name: 'QNAP error: {{ITEM.LASTVALUE}.regsub("103[.]0 = \"(.*)\"", \1)}'
              priority: HIGH
              description: |
                EN: QTS reported an Error level event (SNMP trap eventError). The event name shows the QTS message; the full trap is in the "System: Last SNMP trap (Error)" item. Check the QTS system log. Each trap creates exactly one problem; the problem does not close automatically - close it manually after review.
                PL: QTS zgłosił zdarzenie poziomu Error (pułapka SNMP eventError). Nazwa zdarzenia pokazuje komunikat QTS; pełna pułapka jest w itemie "System: Last SNMP trap (Error)". Sprawdź dziennik systemowy QTS. Każda pułapka tworzy dokładnie jeden problem; problem nie zamyka się sam - zamknij go ręcznie po sprawdzeniu.
              type: MULTIPLE
              manual_close: 'YES'
              tags:
                - tag: component
                  value: system
                - tag: qts_module
                  value: '{{ITEM.VALUE}.regsub("103[.]0 = \"[[]([^]]+)[]]", \1)}'
                - tag: scope
                  value: health
        - uuid: 05819130190745c09fec6ac817f8ffac
          name: 'CPU Temperature'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.24681.1.3.5.0
          key: system.cpu.temp
          units: °C
          description: |
            EN: CPU temperature in °C. Alert threshold: {$TEMP.CPU.CRIT} °C.
            PL: Temperatura procesora w °C. Próg alarmu: {$TEMP.CPU.CRIT} °C.
          tags:
            - tag: component
              value: cpu
            - tag: scope
              value: health
            - tag: sensor
              value: temperature
          triggers:
            - uuid: e1e31e6bfa184587821d72f50163a8e4
              expression: 'last(/SNMP QNAP TVS-473e/system.cpu.temp)>{$TEMP.CPU.CRIT}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/SNMP QNAP TVS-473e/system.cpu.temp)<({$TEMP.CPU.CRIT}-5)'
              name: 'CPU temperature is high ({ITEM.VALUE1}) on {HOST.NAME}'
              priority: WARNING
              description: |
                EN: CPU temperature is above {$TEMP.CPU.CRIT} °C. Check the cooling (fans, air flow, dust) and the CPU load.
                PL: Temperatura procesora przekracza {$TEMP.CPU.CRIT} °C. Sprawdź chłodzenie (wentylatory, przepływ powietrza, kurz) i obciążenie procesora.
              tags:
                - tag: cause
                  value: overheating
                - tag: component
                  value: cpu
                - tag: scope
                  value: health
            - uuid: b6fbfb0557184bf1adf7f29702b395da
              expression: 'nodata(/SNMP QNAP TVS-473e/system.cpu.temp,10m)=1'
              name: 'CPU Temperature sensor is not responding (No data) on {HOST.NAME}'
              priority: AVERAGE
              description: |
                EN: No readings from the CPU temperature sensor for 10 minutes. The thermal state of the CPU cannot be verified.
                PL: Brak odczytów z czujnika temperatury procesora przez 10 minut. Nie da się zweryfikować stanu termicznego procesora.
              manual_close: 'YES'
              dependencies:
                - name: 'Host is unavailable'
                  expression: 'max(/SNMP QNAP TVS-473e/icmpping,3m)=0'
                - name: 'SNMP Agent is unreachable on {HOST.NAME}'
                  expression: 'max(/SNMP QNAP TVS-473e/zabbix[host,snmp,available],5m)=0'
              tags:
                - tag: component
                  value: cpu
                - tag: scope
                  value: availability
        - uuid: 97c099eb6d0e4f9ea5c326745e62da25
          name: 'Firmware version'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: system.fw.version
          delay: 1h
          value_type: TEXT
          description: |
            EN: QTS firmware version, taken from the end of sysDescr. A change raises an information event (firmware update).
            PL: Wersja oprogramowania QTS, pobierana z końca sysDescr. Zmiana wywołuje zdarzenie informacyjne (aktualizacja oprogramowania).
          inventory_link: OS
          preprocessing:
            - type: REGEX
              parameters:
                - '([0-9.]+)$'
                - \1
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: system
            - tag: scope
              value: inventory
          triggers:
            - uuid: 0e43d4ce56104ec2956de45ab0c3020e
              expression: '(last(/SNMP QNAP TVS-473e/system.fw.version,#1)<>last(/SNMP QNAP TVS-473e/system.fw.version,#2))>0'
              name: 'Firmware version has changed on {HOST.NAME}'
              opdata: 'Previous version: {ITEM.VALUE2}, New version: {ITEM.VALUE1}'
              priority: INFO
              description: |
                EN: The QTS firmware version has changed; the previous and the new version are shown in Operational data. Expected after a planned update; otherwise check who updated the NAS.
                PL: Zmieniła się wersja oprogramowania QTS; poprzednia i nowa wersja są w Operational data. Oczekiwane po planowej aktualizacji; w przeciwnym razie sprawdź, kto zaktualizował NAS.
              manual_close: 'YES'
              tags:
                - tag: component
                  value: system
                - tag: scope
                  value: audit
        - uuid: dafe38abfaad45cfac51a7a686e513b0
          name: 'System Serial Number'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.24681.1.4.1.1.1.1.1.2.1.4.1
          key: system.hw.serial
          delay: 6h
          value_type: CHAR
          description: |
            EN: Serial number of the NAS enclosure.
            PL: Numer seryjny obudowy NAS-a.
          inventory_link: SERIALNO_A
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 24h
          tags:
            - tag: component
              value: system
            - tag: scope
              value: inventory
        - uuid: 02da088181d94be18f95fefaabe7187b
          name: 'Model name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.24681.1.3.12.0
          key: system.model
          delay: 1h
          value_type: CHAR
          description: |
            EN: NAS model name reported by QTS.
            PL: Nazwa modelu NAS-a raportowana przez QTS.
          inventory_link: MODEL
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 24h
          tags:
            - tag: component
              value: system
            - tag: scope
              value: inventory
        - uuid: 5f92a3121cd44648a3c4391f8bf5d910
          name: 'System temperature'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.24681.1.3.6.0
          key: system.temp
          units: °C
          description: |
            EN: Motherboard temperature in °C from a static QNAP OID. Alerting is done by the System Component Discovery rule; the trigger on this item is disabled to avoid duplicate alerts.
            PL: Temperatura płyty głównej w °C ze statycznego OID QNAP. Alarmowanie realizuje reguła System Component Discovery; trigger na tym itemie jest wyłączony, żeby nie dublować alertów.
          tags:
            - tag: component
              value: system
            - tag: scope
              value: health
            - tag: sensor
              value: temperature
          triggers:
            - uuid: f208b6cb6c13436eb40b161456e7a839
              expression: 'last(/SNMP QNAP TVS-473e/system.temp) > {$TEMP.SYSTEM.CRIT}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/SNMP QNAP TVS-473e/system.temp) < ({$TEMP.SYSTEM.CRIT}-5)'
              name: 'System temperature is high ({ITEM.VALUE1}) on {HOST.NAME}'
              status: DISABLED
              priority: WARNING
              description: |
                EN: Motherboard temperature is above {$TEMP.SYSTEM.CRIT} °C. Disabled by default: the same alert comes from the System Component Discovery rule for the main unit.
                PL: Temperatura płyty głównej przekracza {$TEMP.SYSTEM.CRIT} °C. Domyślnie wyłączony: ten sam alert daje reguła System Component Discovery dla jednostki głównej.
              tags:
                - tag: cause
                  value: overheating
                - tag: component
                  value: system
                - tag: scope
                  value: health
            - uuid: ecd4dc9a79324b4ab0d4804bedfde769
              expression: 'nodata(/SNMP QNAP TVS-473e/system.temp,10m)=1'
              name: 'System Temperature sensor is not responding (No data) on {HOST.NAME}'
              priority: AVERAGE
              description: |
                EN: No readings from the motherboard temperature sensor for 10 minutes. The sensor module in the NAS may have stopped responding.
                PL: Brak odczytów z czujnika temperatury płyty głównej przez 10 minut. Moduł czujnika w NAS-ie mógł przestać odpowiadać.
              manual_close: 'YES'
              dependencies:
                - name: 'Host is unavailable'
                  expression: 'max(/SNMP QNAP TVS-473e/icmpping,3m)=0'
                - name: 'SNMP Agent is unreachable on {HOST.NAME}'
                  expression: 'max(/SNMP QNAP TVS-473e/zabbix[host,snmp,available],5m)=0'
              tags:
                - tag: component
                  value: system
                - tag: scope
                  value: availability
        - uuid: 6fda5cc4b70c42e99c134f263829788f
          name: 'System uptime (hardware)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.25.1.1.0
          key: system.uptime.hw
          units: uptime
          description: |
            EN: Time since the NAS operating system was started (hrSystemUptime). Resets on every reboot.
            PL: Czas od uruchomienia systemu operacyjnego NAS-a (hrSystemUptime). Zeruje się przy każdym restarcie.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
            - tag: scope
              value: availability
          triggers:
            - uuid: 52aaa77bd24948728e2efeb3aadef54e
              expression: 'last(/SNMP QNAP TVS-473e/system.uptime.hw)<10m'
              name: 'System has been restarted (uptime < 10m)'
              event_name: 'System {HOST.NAME} has been restarted'
              opdata: 'Current uptime: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: |
                EN: The NAS was restarted (uptime below 10 minutes). Check the QTS system log for the cause: power failure, system crash or update.
                PL: NAS został uruchomiony ponownie (czas pracy poniżej 10 minut). Przyczynę sprawdź w dzienniku systemowym QTS: zanik zasilania, awaria systemu albo aktualizacja.
              manual_close: 'YES'
              tags:
                - tag: component
                  value: system
                - tag: scope
                  value: availability
        - uuid: 76a0352ea30649d084851721da2d0b58
          name: 'System uptime (network)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: system.uptime.network
          status: DISABLED
          units: uptime
          description: |
            EN: Time since the SNMP agent on the NAS was started (sysUpTime). Resets on a reboot and on a restart of the SNMP service.
            PL: Czas od uruchomienia agenta SNMP na NAS-ie (sysUpTime). Zeruje się przy restarcie urządzenia i przy restarcie usługi SNMP.
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
            - tag: scope
              value: availability
        - uuid: 343fc9acb99b41c7b006d62e51c72bd3
          name: 'Memory: Free'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.24681.1.3.3.0
          key: vm.memory.free
          units: B
          description: |
            EN: Free memory (RAM) of the NAS reported by QTS, in bytes.
            PL: Wolna pamięć (RAM) NAS-a raportowana przez QTS, w bajtach.
          tags:
            - tag: component
              value: memory
            - tag: scope
              value: capacity
          triggers:
            - uuid: cce8e754cdcf4db28654b0cbdd2a9f87
              expression: 'nodata(/SNMP QNAP TVS-473e/vm.memory.free,10m)=1'
              name: 'Memory metrics are not responding (No data) on {HOST.NAME}'
              priority: AVERAGE
              description: |
                EN: No free memory data for 10 minutes. Memory Utilization cannot be calculated.
                PL: Brak danych o wolnej pamięci przez 10 minut. Nie da się wyliczyć Memory Utilization.
              manual_close: 'YES'
              dependencies:
                - name: 'Host is unavailable'
                  expression: 'max(/SNMP QNAP TVS-473e/icmpping,3m)=0'
                - name: 'SNMP Agent is unreachable on {HOST.NAME}'
                  expression: 'max(/SNMP QNAP TVS-473e/zabbix[host,snmp,available],5m)=0'
              tags:
                - tag: component
                  value: memory
                - tag: scope
                  value: availability
        - uuid: 4b74319803b0455fbebeead339b1655e
          name: 'Memory: Total'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.24681.1.3.2.0
          key: vm.memory.total
          units: B
          description: |
            EN: Total memory (RAM) of the NAS reported by QTS, in bytes.
            PL: Całkowita pamięć (RAM) NAS-a raportowana przez QTS, w bajtach.
          tags:
            - tag: component
              value: memory
            - tag: scope
              value: capacity
        - uuid: c69a661e9c64460383b2d6c42eb7820b
          name: 'Memory Utilization'
          type: CALCULATED
          key: vm.memory.util
          value_type: FLOAT
          units: '%'
          params: '100 * (last(//vm.memory.total) - last(//vm.memory.free)) / last(//vm.memory.total)'
          description: |
            EN: Memory utilization in percent, calculated from Memory: Total and Memory: Free as 100 * (total - free) / total.
            PL: Wykorzystanie pamięci w procentach, wyliczane z Memory: Total i Memory: Free jako 100 * (całkowita - wolna) / całkowita.
          tags:
            - tag: component
              value: memory
            - tag: scope
              value: performance
        - uuid: e00c51b1f07248ed81bb557923e2a4b6
          name: 'SNMP Availability'
          type: INTERNAL
          key: 'zabbix[host,snmp,available]'
          description: |
            EN: Availability of the host's SNMP interface as seen by Zabbix (internal item zabbix[host,snmp,available]).
            PL: Dostępność interfejsu SNMP hosta z punktu widzenia Zabbix (item wewnętrzny zabbix[host,snmp,available]).
          valuemap:
            name: 'Service State'
          tags:
            - tag: component
              value: snmp
            - tag: scope
              value: availability
          triggers:
            - uuid: bc7ebe39d86b451ca1bf6c90d15b757f
              expression: 'max(/SNMP QNAP TVS-473e/zabbix[host,snmp,available],5m)=0'
              name: 'SNMP Agent is unreachable on {HOST.NAME}'
              priority: AVERAGE
              description: |
                EN: Zabbix has not been able to query the NAS over SNMP for 5 minutes. Check the SNMP service in QTS, the community or SNMPv3 credentials and the firewall between the NAS and the Zabbix proxy.
                PL: Zabbix od 5 minut nie może odpytać NAS-a przez SNMP. Sprawdź usługę SNMP w QTS, community lub dane SNMPv3 oraz firewall między NAS-em a proxy Zabbix.
              dependencies:
                - name: 'Host is unavailable'
                  expression: 'max(/SNMP QNAP TVS-473e/icmpping,3m)=0'
              tags:
                - tag: component
                  value: snmp
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: a7dd4c600fdc4f0ba582bfc65b7b7ad6
          name: 'Ethernet Interface Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1]'
          key: net.if.ethernet.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.MATCHES}'
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: |
            EN: Discovers physical Ethernet interfaces of the NAS from ifName. Includes names matching {$NET.IF.IFNAME.MATCHES} and skips virtual interfaces matching {$NET.IF.IFNAME.NOT_MATCHES}.
            PL: Wykrywa fizyczne interfejsy Ethernet NAS-a na podstawie ifName. Uwzględnia nazwy pasujące do {$NET.IF.IFNAME.MATCHES} i pomija interfejsy wirtualne pasujące do {$NET.IF.IFNAME.NOT_MATCHES}.
          item_prototypes:
            - uuid: 43286ad796884517847f0791d89d83d4
              name: '{#IFNAME}: Inbound discards'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
              key: 'net.if.in.discards[{#SNMPINDEX}]'
              delay: 5m
              units: discards/s
              description: |
                EN: Inbound packets discarded by the interface per second (ifInDiscards), e.g. because of full buffers.
                PL: Pakiety przychodzące odrzucone przez interfejs na sekundę (ifInDiscards), np. z powodu pełnych buforów.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: health
            - uuid: 86ce021782094f41855d3539c234a720
              name: '{#IFNAME}: Inbound errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
              key: 'net.if.in.errors[{#SNMPINDEX}]'
              delay: 5m
              units: errors/s
              description: |
                EN: Inbound packets with errors per second (ifInErrors). Errors usually point to a cable, connector or switch port problem.
                PL: Pakiety przychodzące z błędami na sekundę (ifInErrors). Błędy zwykle wskazują na problem z kablem, wtyczką albo portem na switchu.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: health
            - uuid: ec004657e820470dac6831d70dc0a549
              name: '{#IFNAME}: Inbound utilization'
              type: CALCULATED
              key: 'net.if.in.util[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: '%'
              params: '100 * last(//net.if.in[{#SNMPINDEX}]) / (last(//net.if.speed[{#SNMPINDEX}]) + (last(//net.if.speed[{#SNMPINDEX}]) = 0))'
              description: |
                EN: Inbound utilization of the interface in percent: incoming traffic divided by interface speed. 0 when the speed is unknown. Alert threshold: {$NET.IF.UTIL.MAX}%.
                PL: Wykorzystanie interfejsu w kierunku przychodzącym w procentach: ruch przychodzący podzielony przez prędkość interfejsu. 0, gdy prędkość jest nieznana. Próg alarmu: {$NET.IF.UTIL.MAX}%.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'return parseFloat(value).toFixed(2);'
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: performance
            - uuid: 57591ecb537a46bbbc16c4c88f62bebe
              name: '{#IFNAME}: Incoming traffic'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'net.if.in[{#SNMPINDEX}]'
              units: bps
              description: |
                EN: Incoming traffic in bits per second, from the 64-bit counter ifHCInOctets multiplied by 8.
                PL: Ruch przychodzący w bitach na sekundę, z 64-bitowego licznika ifHCInOctets pomnożonego przez 8.
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: performance
            - uuid: e006da1d924b4d2cbeeb0a538891a450
              name: '{#IFNAME}: MAC Address'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.6.{#SNMPINDEX}'
              key: 'net.if.mac[{#SNMPINDEX}]'
              delay: 1h
              value_type: TEXT
              description: |
                EN: MAC address of the interface (ifPhysAddress).
                PL: Adres MAC interfejsu (ifPhysAddress).
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 24h
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: inventory
            - uuid: 833ae113041447cb95976f28c8224141
              name: '{#IFNAME}: Outbound discards'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}'
              key: 'net.if.out.discards[{#SNMPINDEX}]'
              delay: 5m
              units: discards/s
              description: |
                EN: Outbound packets discarded by the interface per second (ifOutDiscards), e.g. because of full buffers.
                PL: Pakiety wychodzące odrzucone przez interfejs na sekundę (ifOutDiscards), np. z powodu pełnych buforów.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: health
            - uuid: 1f661d7b56094d61b700444f6380b866
              name: '{#IFNAME}: Outbound errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
              key: 'net.if.out.errors[{#SNMPINDEX}]'
              delay: 5m
              units: errors/s
              description: |
                EN: Outbound packets with errors per second (ifOutErrors). Errors usually point to a cable, connector or switch port problem.
                PL: Pakiety wychodzące z błędami na sekundę (ifOutErrors). Błędy zwykle wskazują na problem z kablem, wtyczką albo portem na switchu.
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: health
            - uuid: 2435303d21c24de797c3849c0b68c594
              name: '{#IFNAME}: Outbound utilization'
              type: CALCULATED
              key: 'net.if.out.util[{#SNMPINDEX}]'
              delay: 5m
              value_type: FLOAT
              units: '%'
              params: '100 * last(//net.if.out[{#SNMPINDEX}]) / (last(//net.if.speed[{#SNMPINDEX}]) + (last(//net.if.speed[{#SNMPINDEX}]) = 0))'
              description: |
                EN: Outbound utilization of the interface in percent: outgoing traffic divided by interface speed. 0 when the speed is unknown. Alert threshold: {$NET.IF.UTIL.MAX}%.
                PL: Wykorzystanie interfejsu w kierunku wychodzącym w procentach: ruch wychodzący podzielony przez prędkość interfejsu. 0, gdy prędkość jest nieznana. Próg alarmu: {$NET.IF.UTIL.MAX}%.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'return parseFloat(value).toFixed(2);'
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: performance
            - uuid: 9155b7fdefc34055b048f410d3889c75
              name: '{#IFNAME}: Outgoing traffic'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'net.if.out[{#SNMPINDEX}]'
              units: bps
              description: |
                EN: Outgoing traffic in bits per second, from the 64-bit counter ifHCOutOctets multiplied by 8.
                PL: Ruch wychodzący w bitach na sekundę, z 64-bitowego licznika ifHCOutOctets pomnożonego przez 8.
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: performance
            - uuid: b6c4d53429ea44128cb6b7648b6eef21
              name: '{#IFNAME}: Interface speed'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
              key: 'net.if.speed[{#SNMPINDEX}]'
              delay: 1h
              units: bps
              description: |
                EN: Negotiated interface speed in bits per second, from ifHighSpeed (Mbps) multiplied by 1 000 000.
                PL: Wynegocjowana prędkość interfejsu w bitach na sekundę, z ifHighSpeed (Mb/s) pomnożonego przez 1 000 000.
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 12h
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: performance
              trigger_prototypes:
                - uuid: 1c4b1f71750144a898c98dcd3548f397
                  expression: '(last(/SNMP QNAP TVS-473e/net.if.speed[{#SNMPINDEX}],#1)<>last(/SNMP QNAP TVS-473e/net.if.speed[{#SNMPINDEX}],#2)) and last(/SNMP QNAP TVS-473e/net.if.speed[{#SNMPINDEX}])>0'
                  name: '{#IFNAME}: Interface speed changed (Current: {ITEM.VALUE})'
                  priority: INFO
                  description: |
                    EN: The negotiated speed of {#IFNAME} has changed, e.g. from 1 Gbps to 100 Mbps. Usually a cable, switch port or auto-negotiation problem; expected after replacing the cable or the switch. The problem closes when the next speed reading confirms the new value (up to 12 hours).
                    PL: Zmieniła się wynegocjowana prędkość {#IFNAME}, np. z 1 Gb/s na 100 Mb/s. Zwykle to problem z kablem, portem na switchu albo autonegocjacją; oczekiwane po wymianie kabla lub switcha. Problem zamyka się, gdy kolejny odczyt prędkości potwierdzi nową wartość (do 12 godzin).
                  tags:
                    - tag: component
                      value: network
                    - tag: scope
                      value: performance
            - uuid: 530a98996eb54e60b165bd9723089fa8
              name: '{#IFNAME}: Operational status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.status[{#SNMPINDEX}]'
              description: |
                EN: Operational state of the interface (ifOperStatus): up, down, testing, unknown, dormant, notPresent or lowerLayerDown.
                PL: Stan operacyjny interfejsu (ifOperStatus): up, down, testing, unknown, dormant, notPresent albo lowerLayerDown.
              valuemap:
                name: 'SNMP interface status (ifOperStatus)'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: availability
              trigger_prototypes:
                - uuid: 2dc48455f3ce4b28b2aaa57647618c02
                  expression: 'last(/SNMP QNAP TVS-473e/net.if.status[{#SNMPINDEX}])<>1 and last(/SNMP QNAP TVS-473e/net.if.status[{#SNMPINDEX}],#1)<>last(/SNMP QNAP TVS-473e/net.if.status[{#SNMPINDEX}],#2)'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/SNMP QNAP TVS-473e/net.if.status[{#SNMPINDEX}])=1'
                  name: '{#IFNAME}: Interface is down on {HOST.NAME}'
                  priority: HIGH
                  description: |
                    EN: Interface {#IFNAME} changed its operational state (ifOperStatus) from Up to another state. The problem stays open until the interface is Up again. Check the cable, the switch port and the port settings in QTS.
                    PL: Interfejs {#IFNAME} zmienił stan operacyjny (ifOperStatus) z Up na inny. Problem pozostaje otwarty, dopóki interfejs nie wróci do stanu Up. Sprawdź kabel, port na switchu i ustawienia portu w QTS.
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: network
                    - tag: scope
                      value: availability
          trigger_prototypes:
            - uuid: d4b5f4ea91974d9e8b88d237b95a4e7e
              expression: 'min(/SNMP QNAP TVS-473e/net.if.in.util[{#SNMPINDEX}],10m)>{$NET.IF.UTIL.MAX} or min(/SNMP QNAP TVS-473e/net.if.out.util[{#SNMPINDEX}],10m)>{$NET.IF.UTIL.MAX}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/SNMP QNAP TVS-473e/net.if.in.util[{#SNMPINDEX}],10m)<70 and max(/SNMP QNAP TVS-473e/net.if.out.util[{#SNMPINDEX}],10m)<70'
              name: '{#IFNAME}: High bandwidth utilization (>{$NET.IF.UTIL.MAX}%)'
              priority: WARNING
              description: |
                EN: Inbound or outbound utilization of {#IFNAME} has stayed above {$NET.IF.UTIL.MAX}% for 10 minutes. Consider link aggregation, a faster port or moving traffic to another interface.
                PL: Wykorzystanie {#IFNAME} w kierunku przychodzącym lub wychodzącym przekracza {$NET.IF.UTIL.MAX}% od 10 minut. Rozważ agregację łączy, szybszy port albo przeniesienie ruchu na inny interfejs.
              manual_close: 'YES'
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: performance
            - uuid: 5b9ad85b73f8436a9b9effd5ad2c7565
              expression: 'avg(/SNMP QNAP TVS-473e/net.if.in.errors[{#SNMPINDEX}],5m)>0 or avg(/SNMP QNAP TVS-473e/net.if.out.errors[{#SNMPINDEX}],5m)>0'
              name: '{#IFNAME}: High Error Rate (Cable/Switch failure?)'
              priority: HIGH
              description: |
                EN: Inbound or outbound packet errors were detected on {#IFNAME} in the last 5 minutes. This usually points to a damaged Ethernet cable, a faulty connector or a switch port problem.
                PL: W ostatnich 5 minutach na {#IFNAME} wykryto błędy pakietów przychodzących lub wychodzących. Zwykle oznacza to uszkodzony kabel Ethernet, wadliwą wtyczkę albo problem z portem na switchu.
              manual_close: 'YES'
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: health
          graph_prototypes:
            - uuid: bdbc6bf88e354bab83906930a8955f50
              name: 'Traffic: {#IFNAME}'
              graph_items:
                - drawtype: GRADIENT_LINE
                  color: 1A7C11
                  calc_fnc: ALL
                  item:
                    host: 'SNMP QNAP TVS-473e'
                    key: 'net.if.in[{#SNMPINDEX}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: '274482'
                  calc_fnc: ALL
                  item:
                    host: 'SNMP QNAP TVS-473e'
                    key: 'net.if.out[{#SNMPINDEX}]'
        - uuid: c16015298b45412bb36d36ed59986c32
          name: 'System Component Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#COMPNAME},1.3.6.1.4.1.24681.1.4.1.1.1.1.1.2.1.3]'
          key: qnap.component.discovery
          delay: 1h
          filter:
            conditions:
              - macro: '{#COMPNAME}'
                value: ^(BOOT|USB)$
                operator: NOT_MATCHES_REGEX
          description: |
            EN: Discovers the main NAS unit, expansion units (e.g. TR-004, TL series) and QM2 cards from the QNAP private MIB; BOOT and USB entries are skipped. For the main unit (TVS-473) it provides the temperature alert - the trigger on the static "System temperature" item is disabled to avoid duplicates. Do not disable this rule. QM2 cards report no temperature (-100), so the override "Watchdog exclusion for QM2 cards" does not create their No data trigger.
            PL: Wykrywa jednostkę główną NAS-a, jednostki rozszerzające (np. TR-004, seria TL) i karty QM2 z prywatnego MIB QNAP; wpisy BOOT i USB są pomijane. Dla jednostki głównej (TVS-473) daje alert temperatury - trigger na statycznym itemie "System temperature" jest wyłączony, żeby nie dublować alertów. Nie wyłączaj tej reguły. Karty QM2 nie raportują temperatury (-100), więc override "Watchdog exclusion for QM2 cards" nie tworzy dla nich triggera No data.
          item_prototypes:
            - uuid: 9e9aba0bbcfd41e89957ccfd5b0781a1
              name: '{#COMPNAME}: Serial Number'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.1.1.1.1.2.1.4.{#SNMPINDEX}'
              key: 'qnap.component.serial[{#SNMPINDEX}]'
              delay: 12h
              value_type: TEXT
              description: |
                EN: Serial number of {#COMPNAME}.
                PL: Numer seryjny {#COMPNAME}.
              tags:
                - tag: component
                  value: system
                - tag: scope
                  value: inventory
            - uuid: 774773bee29843f09f0605e4ba35b416
              name: '{#COMPNAME}: Number of Slots'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.1.1.1.1.2.1.5.{#SNMPINDEX}'
              key: 'qnap.component.slots[{#SNMPINDEX}]'
              delay: 12h
              description: |
                EN: Number of drive slots in {#COMPNAME}.
                PL: Liczba slotów na dyski w {#COMPNAME}.
              tags:
                - tag: component
                  value: system
                - tag: scope
                  value: inventory
            - uuid: 56e2ad3e4545458790ef5b12c6d74c5c
              name: '{#COMPNAME}: Temperature'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.1.1.1.1.2.1.7.{#SNMPINDEX}'
              key: 'qnap.component.temp[{#SNMPINDEX}]'
              delay: 10m
              value_type: FLOAT
              units: °C
              description: |
                EN: Temperature of {#COMPNAME} in °C. Values outside 0-120 °C (e.g. -100 reported by QM2 cards) are discarded. Alert threshold: {$TEMP.SYSTEM.CRIT} °C.
                PL: Temperatura {#COMPNAME} w °C. Wartości spoza 0-120 °C (np. -100 raportowane przez karty QM2) są odrzucane. Próg alarmu: {$TEMP.SYSTEM.CRIT} °C.
              preprocessing:
                - type: IN_RANGE
                  parameters:
                    - '0'
                    - '120'
                  error_handler: DISCARD_VALUE
              tags:
                - tag: component
                  value: system
                - tag: scope
                  value: health
                - tag: sensor
                  value: temperature
              trigger_prototypes:
                - uuid: 1418ccacff2f43c59e3463b5b6bcd0c8
                  expression: 'last(/SNMP QNAP TVS-473e/qnap.component.temp[{#SNMPINDEX}])>{$TEMP.SYSTEM.CRIT}'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/SNMP QNAP TVS-473e/qnap.component.temp[{#SNMPINDEX}])<({$TEMP.SYSTEM.CRIT}-5)'
                  name: '{#COMPNAME}: Temperature is high ({ITEM.VALUE1}) on {HOST.NAME}'
                  priority: WARNING
                  description: |
                    EN: Temperature of {#COMPNAME} is above {$TEMP.SYSTEM.CRIT} °C. The problem closes when it falls below {$TEMP.SYSTEM.CRIT} - 5 °C. Check the fans and the air flow.
                    PL: Temperatura {#COMPNAME} przekracza {$TEMP.SYSTEM.CRIT} °C. Problem zamyka się, gdy spadnie poniżej {$TEMP.SYSTEM.CRIT} - 5 °C. Sprawdź wentylatory i przepływ powietrza.
                  manual_close: 'YES'
                  tags:
                    - tag: cause
                      value: overheating
                    - tag: component
                      value: system
                    - tag: scope
                      value: health
                - uuid: cbb1ddc4004f4dcd87d8ef7334874179
                  expression: 'nodata(/SNMP QNAP TVS-473e/qnap.component.temp[{#SNMPINDEX}],30m)=1'
                  name: '{#COMPNAME}: Temperature sensor is not responding (No data) on {HOST.NAME}'
                  priority: AVERAGE
                  description: |
                    EN: No temperature readings from {#COMPNAME} for 30 minutes. The enclosure management controller may have stopped responding.
                    PL: Brak odczytów temperatury z {#COMPNAME} od 30 minut. Kontroler zarządzania obudową mógł przestać odpowiadać.
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Host is unavailable'
                      expression: 'max(/SNMP QNAP TVS-473e/icmpping,3m)=0'
                    - name: 'SNMP Agent is unreachable on {HOST.NAME}'
                      expression: 'max(/SNMP QNAP TVS-473e/zabbix[host,snmp,available],5m)=0'
                  tags:
                    - tag: component
                      value: system
                    - tag: scope
                      value: health
          overrides:
            - name: 'Watchdog exclusion for QM2 cards'
              step: '1'
              filter:
                conditions:
                  - macro: '{#COMPNAME}'
                    value: '^QM2.*'
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: 'Temperature sensor is not responding (No data)'
                  discover: NO_DISCOVER
        - uuid: 6bb378ffbc4e43ed9e4c10de6cfb24da
          name: 'CPU Core Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#COREID},1.3.6.1.4.1.24681.1.4.1.1.1.1.4.3.1.2]'
