          snmp_oid: 'discovery[{#RAIDID},1.3.6.1.4.1.24681.1.4.1.1.1.2.1.2.1.2]'
          key: qnap.raid.discovery
          delay: 1h
          description: |
            EN: Discovers RAID groups (storage pools) of the NAS from the QNAP private MIB and monitors their status, capacity and rebuild progress.
            PL: Wykrywa grupy RAID (pule pamięci masowej) NAS-a z prywatnego MIB QNAP i monitoruje ich status, pojemność i postęp odbudowy.
          item_prototypes:
            - uuid: c68c126f342b4831acce1527070a0fea
              name: 'RAID {#RAIDID}: Free Space'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.1.1.2.1.2.1.4.{#SNMPINDEX}'
              key: 'qnap.raid.free[{#SNMPINDEX}]'
