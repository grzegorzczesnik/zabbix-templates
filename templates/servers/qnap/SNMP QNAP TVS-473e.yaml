                  value: capacity
            - uuid: 61250739d9ff48479af0ff34588d5d17
              name: 'RAID Group {#RAIDID}: Level'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.1.1.2.1.2.1.7.{#SNMPINDEX}'
              key: 'qnap.raid.level[{#SNMPINDEX}]'
