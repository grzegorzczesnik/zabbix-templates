                    - tag: scope
                      value: health
                - uuid: d3618d9029cd44ebab5098333b00439c
                  expression: 'nodata(/SNMP QNAP TVS-473e/qnap.fan.speed[{#FANID}],30m)=1'
                  name: 'Fan {#FANID}: Speed sensor is not responding (No data) on {HOST.NAME}'
                  priority: AVERAGE
                  description: |
                    EN: No fan speed (RPM) data received for 30 minutes. The cooling control module has stopped reporting readings, risking hardware overheating.
                    PL: Brak danych o prędkości obrotowej wentylatora (RPM) przez 30 minut. Moduł sterujący chłodzeniem przestał raportować odczyty, co grozi przegrzaniem sprzętu.
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Host is unavailable'
                      expression: 'max(/SNMP QNAP TVS-473e/icmpping,3m)=0'
                    - name: 'SNMP Agent is unreachable on {HOST.NAME}'
                      expression: 'max(/SNMP QNAP TVS-473e/zabbix[host,snmp,available],5m)=0'
                  tags:
                    - tag: component
                      value: fan
                    - tag: scope
                      value: health
            - uuid: 0cb6bbef4fe249bd9f029ef8d2d9b530
              name: 'Fan {#FANID}: Status Code'
