                EN: Speed of fan {#FANID} in RPM; the number is extracted from the text value in preprocessing. Below {$FAN.SPEED.MIN} RPM the fan is treated as stopped.
                PL: Prędkość wentylatora {#FANID} w RPM; liczba jest wyciągana z wartości tekstowej w preprocessingu. Poniżej {$FAN.SPEED.MIN} RPM wentylator jest uznawany za zatrzymany.
