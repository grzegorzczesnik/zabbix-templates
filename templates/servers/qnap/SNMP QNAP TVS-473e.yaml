                    PL: QTS zgłasza awarię wentylatora {#FANID}. Sprawdź wentylator w QTS (Panel sterowania - Sprzęt) i w razie potrzeby wymień go.
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: fan
                    - tag: scope
                      value: health
          graph_prototypes:
