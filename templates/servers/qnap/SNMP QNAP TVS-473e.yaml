                - tag: scope
                  value: health
            - uuid: 1b931feca4534ab5b4aca99326756900
              name: 'RAID {#RAIDID}: Status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.1.1.2.1.2.1.5.{#SNMPINDEX}'
              key: 'qnap.raid.status[{#SNMPINDEX}]'
              delay: 5m
              trends: '0'
              description: |
                EN: Status of RAID group {#RAIDID}, read from the QNAP private MIB as text (e.g. "Ready", "Degraded") and converted by JavaScript preprocessing to a numeric code (value map "QNAP RAID Status"). 0 = unknown/error, 1 = Ready, 2-7 = maintenance (rebuilding, scrubbing, synchronizing, migrating, expanding, initializing), 10-13 = critical (degraded, failed, inactive, unmounting). OID: 1.3.6.1.4.1.24681.1.4.1.1.1.2.1.2.1.5.{#SNMPINDEX}
                PL: Status grupy RAID {#RAIDID}, odczytywany z prywatnego MIB QNAP jako tekst (np. "Ready", "Degraded") i zamieniany preprocessingiem JavaScript na kod liczbowy (mapa wartości "QNAP RAID Status"). 0 = nieznany/błąd, 1 = Ready, 2-7 = operacje serwisowe (odbudowa, scrubbing, synchronizacja, migracja, rozszerzanie, inicjalizacja), 10-13 = stan krytyczny (degraded, failed, inactive, unmounting). OID: 1.3.6.1.4.1.24681.1.4.1.1.1.2.1.2.1.5.{#SNMPINDEX}
              valuemap:
                name: 'QNAP RAID Status'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      // 1. Normalizacja wejścia (usuwamy spacje i ujednolicamy wielkość liter)
                      var val = value.trim().toLowerCase();
                      
                      // 2. Mapa statusów tekstowych na liczby (zgodnie ze słownikiem)
                      var statusMap = {
                          "ready": 1,
                          "rebuilding": 2,
                          "scrubbing": 3,
                          "synchronizing": 4,
                          "migrating": 5,
                          "expanding": 6,
                          "initialing": 7,
                          "initializing": 7,
                          "degraded": 10,
                          "failed": 11,
                          "inactive": 12,
                          "unmounting": 13
                      };
                      
                      // 3. Obsługa wejść numerycznych (dla testów zabbix_sender)
                      if (!isNaN(val) && val !== "") {
                          return parseInt(val);
                      }
                      
                      // 4. Dopasowanie tekstowe (dla danych SNMP)
                      if (statusMap[val] !== undefined) {
                          return statusMap[val];
                      }
                      
                      // 5. Fallback: Jeśli status jest nieznany, zwróć 0 (Error)
                      return 0;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 10m
              tags:
                - tag: component
                  value: storage
                - tag: scope
                  value: health
              trigger_prototypes:
                - uuid: 47905e50611547ff81087c819c133964
                  expression: 'last(/SNMP QNAP TVS-473e/qnap.raid.status[{#SNMPINDEX}])>=10 or last(/SNMP QNAP TVS-473e/qnap.raid.status[{#SNMPINDEX}])=0'
                  name: 'RAID Group {#RAIDID}: RAID group status is Critical (Degraded/Failed)'
                  opdata: 'Status: {ITEM.VALUE}'
                  priority: HIGH
                  description: |
                    EN: RAID group {#RAIDID} is in a critical state (Degraded, Failed, Inactive, Unmounting) or its status is unknown. One or more drives may have failed; check Storage & Snapshots in QTS now.
                    PL: Grupa RAID {#RAIDID} jest w stanie krytycznym (Degraded, Failed, Inactive, Unmounting) albo jej status jest nieznany. Jeden lub więcej dysków mogło ulec awarii; sprawdź od razu Pamięć masową i migawki w QTS.
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: storage
                    - tag: scope
                      value: health
                - uuid: 9f0317c4b42c4a99b510cd960341bd3f
                  expression: 'last(/SNMP QNAP TVS-473e/qnap.raid.status[{#SNMPINDEX}])>=2 and last(/SNMP QNAP TVS-473e/qnap.raid.status[{#SNMPINDEX}])<=7'
                  name: 'RAID Group {#RAIDID}: RAID maintenance or synchronization in progress'
                  opdata: 'Activity: {ITEM.VALUE}'
                  priority: WARNING
                  description: |
                    EN: RAID group {#RAIDID} is running a maintenance operation (rebuilding, scrubbing, synchronizing, migrating, expanding or initializing). Performance may be reduced until it finishes.
                    PL: Grupa RAID {#RAIDID} wykonuje operację serwisową (odbudowa, scrubbing, synchronizacja, migracja, rozszerzanie albo inicjalizacja). Do jej zakończenia wydajność może być obniżona.
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: storage
                    - tag: scope
                      value: health
                - uuid: e8cefa97b57d4277a9bb252c47d43ba4
                  expression: 'nodata(/SNMP QNAP TVS-473e/qnap.raid.status[{#SNMPINDEX}],30m)=1'
                  name: 'RAID {#RAIDID}: Status is not responding (No data) on {HOST.NAME}'
                  priority: AVERAGE
                  description: |
                    EN: RAID group {#RAIDID} has not reported its status for 30 minutes. The state of the array cannot be verified - risk of a silent failure.
                    PL: Grupa RAID {#RAIDID} nie raportuje statusu od 30 minut. Nie da się zweryfikować stanu macierzy - ryzyko cichej awarii.
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Host is unavailable'
                      expression: 'max(/SNMP QNAP TVS-473e/icmpping,3m)=0'
                    - name: 'SNMP Agent is unreachable on {HOST.NAME}'
                      expression: 'max(/SNMP QNAP TVS-473e/zabbix[host,snmp,available],5m)=0'
                  tags:
                    - tag: component
                      value: storage
                    - tag: scope
                      value: health
            - uuid: 78954ccc5116488f87ed3bfdd22ac9e7
              name: 'RAID {#RAIDID}: Total Capacity'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.1.1.2.1.2.1.3.{#SNMPINDEX}'
              key: 'qnap.raid.total[{#SNMPINDEX}]'
              delay: 15m
