      macros:
        - macro: '{$CPU.UTIL.CRIT}'
          value: '90'
          description: 'EN: Critical CPU utilization threshold (%), checked as the 10-minute average.  PL: Krytyczny próg wykorzystania procesora (%), sprawdzany jako średnia z 10 minut.'
        - macro: '{$EXT.FREE.MIN}'
          value: '10'
          description: 'EN: Low free space threshold for external USB/eSATA drives (%). PL: Próg małej ilości wolnego miejsca na dyskach zewnętrznych USB/eSATA (%).'
        - macro: '{$FAN.SPEED.MIN}'
          value: '200'
          description: 'EN: Minimum fan speed (RPM); below it the fan is treated as stopped. PL: Minimalna prędkość wentylatora (RPM); poniżej niej wentylator jest uznawany za zatrzymany.'
        - macro: '{$NET.IF.IFNAME.MATCHES}'
          value: '^eth[0-3]$'
          description: 'EN: Regular expression for physical network interfaces to discover.  PL: Wyrażenie regularne dla fizycznych interfejsów sieciowych do wykrycia.'
        - macro: '{$NET.IF.IFNAME.NOT_MATCHES}'
          value: (veth|vnet|docker|lo|lxc|qvs|dummy|tun)
          description: 'EN: Regular expression excluding virtual interfaces from discovery.  PL: Wyrażenie regularne wykluczające interfejsy wirtualne z wykrywania.'
        - macro: '{$NET.IF.UTIL.MAX}'
          value: '80'
          description: 'EN: Interface utilization threshold (%), inbound or outbound, as a 10-minute minimum. PL: Próg wykorzystania interfejsu (%), przychodzącego lub wychodzącego, jako minimum z 10 minut.'
        - macro: '{$QNAP.WEB.PORT}'
          value: '8080'
          description: 'EN: TCP port of the QTS web interface, used by the service check.  PL: Port TCP interfejsu WWW QTS, używany przez test usługi.'
        - macro: '{$TEMP.CPU.CRIT}'
          value: '85'
          description: 'EN: Critical CPU temperature (°C). Above it the CPU may throttle.  PL: Krytyczna temperatura procesora (°C). Powyżej niej procesor może ograniczać wydajność.'
        - macro: '{$TEMP.DISK.CRIT}'
          value: '60'
          description: 'EN: Critical drive temperature (°C). Above it the risk of drive failure rises sharply.  PL: Krytyczna temperatura dysku (°C). Powyżej niej ryzyko awarii dysku gwałtownie rośnie.'
        - macro: '{$TEMP.DISK.WARN}'
          value: '50'
          description: 'EN: Warning drive temperature (°C). Usually points to poor air flow.  PL: Ostrzegawcza temperatura dysku (°C). Zwykle wskazuje na słabą cyrkulację powietrza.'
        - macro: '{$TEMP.SYSTEM.CRIT}'
          value: '65'
          description: 'EN: Critical system (motherboard) temperature (°C). Usually points to a chassis fan problem.  PL: Krytyczna temperatura systemu (płyty głównej) (°C). Zwykle wskazuje na problem z wentylatorem obudowy.'
        - macro: '{$VFS.FREE.MIN.CRIT}'
          value: '10'
          description: 'EN: Critically low free space on a volume (%). Can be set per volume with a context macro.  PL: Krytycznie mało wolnego miejsca na wolumenie (%). Można ustawić osobno dla wolumenu makrem z kontekstem.'
        - macro: '{$VFS.FREE.MIN.WARN}'
          value: '20'
          description: 'EN: Low free space on a volume (%). Can be set per volume with a context macro.  PL: Mało wolnego miejsca na wolumenie (%). Można ustawić osobno dla wolumenu makrem z kontekstem.'
