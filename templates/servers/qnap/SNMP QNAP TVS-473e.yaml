            EN: Discovers logical volumes of the NAS from the QTS volume table; external drives (EXDR) are skipped and handled by External Drive Discovery. Free space thresholds can be set per volume with context macros, e.g. {$VFS.FREE.MIN.WARN:"[Volume Media, Pool 2]"} - the context is the full volume name reported by QTS.
            PL: Wykrywa wolumeny logiczne NAS-a z tabeli wolumenów QTS; dyski zewnętrzne (EXDR) są pomijane i obsługuje je External Drive Discovery. Progi wolnego miejsca można ustawić osobno dla wolumenu makrami z kontekstem, np. {$VFS.FREE.MIN.WARN:"[Volume Media, Pool 2]"} - kontekstem jest pełna nazwa wolumenu raportowana przez QTS.
          item_prototypes:
            - uuid: dde533a0ae8048d487103612ef18f253
              name: '{{#VOLUMENAME}.regsub("^[[]Volume (.+), (Pool [0-9]+)[]]$", "\1 (\2)")}: Free space'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.2.17.1.5.{#SNMPINDEX}'
              key: 'qnap.volume.free[{#SNMPINDEX}]'
              delay: 30m
              units: B
              description: |
                EN: Free space on volume {#VOLUMENAME} in bytes. QTS returns text with a unit (e.g. "1.5 TB"); JavaScript preprocessing converts it to whole bytes.
                PL: Wolne miejsce na wolumenie {#VOLUMENAME} w bajtach. QTS zwraca tekst z jednostką (np. "1.5 TB"); preprocessing JavaScript przelicza go na pełne bajty.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var value_clean = value.replace(/\s+/g, '');
                      var unit = value_clean.replace(/[0-9.]/g, '').toUpperCase();
                      var num = parseFloat(value_clean);
                      
                      if (isNaN(num)) {
                          throw 'Value is not a number: ' + value;
                      }
                      
                      if (unit === 'TB') {
                          return Math.round(num * 1024 * 1024 * 1024 * 1024);
                      } else if (unit === 'GB') {
                          return Math.round(num * 1024 * 1024 * 1024);
                      } else if (unit === 'MB') {
                          return Math.round(num * 1024 * 1024);
                      } else if (unit === 'KB') {
                          return Math.round(num * 1024);
                      }
                      
                      return Math.round(num);
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: storage
                - tag: scope
                  value: capacity
            - uuid: 7928bb923477410587684dd6ccd5e809
              name: '{{#VOLUMENAME}.regsub("^[[]Volume (.+), (Pool [0-9]+)[]]$", "\1 (\2)")}: Total size'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.2.17.1.4.{#SNMPINDEX}'
              key: 'qnap.volume.total[{#SNMPINDEX}]'
              delay: 30m
              units: B
              description: |
                EN: Total size of volume {#VOLUMENAME} in bytes. QTS returns text with a unit (e.g. "2 TB"); JavaScript preprocessing converts it to whole bytes.
                PL: Całkowity rozmiar wolumenu {#VOLUMENAME} w bajtach. QTS zwraca tekst z jednostką (np. "2 TB"); preprocessing JavaScript przelicza go na pełne bajty.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var value_clean = value.replace(/\s+/g, '');
                      var unit = value_clean.replace(/[0-9.]/g, '').toUpperCase();
                      var num = parseFloat(value_clean);
                      
                      if (isNaN(num)) {
                          throw 'Value is not a number: ' + value;
                      }
                      
                      if (unit === 'TB') {
                          return Math.round(num * 1024 * 1024 * 1024 * 1024);
                      } else if (unit === 'GB') {
                          return Math.round(num * 1024 * 1024 * 1024);
                      } else if (unit === 'MB') {
                          return Math.round(num * 1024 * 1024);
                      } else if (unit === 'KB') {
                          return Math.round(num * 1024);
                      }
                      
                      return Math.round(num);
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 24h
              tags:
                - tag: component
                  value: storage
                - tag: scope
                  value: capacity
            - uuid: 0db1fc6e057842e5a6f04edc4b6f4389
              name: '{{#VOLUMENAME}.regsub("^[[]Volume (.+), (Pool [0-9]+)[]]$", "\1 (\2)")}: Space utilization'
              type: CALCULATED
              key: 'qnap.volume.util[{#SNMPINDEX}]'
              delay: 30m
              value_type: FLOAT
              units: '%'
              params: '100 * (last(//qnap.volume.total[{#SNMPINDEX}]) - last(//qnap.volume.free[{#SNMPINDEX}])) / last(//qnap.volume.total[{#SNMPINDEX}])'
              description: |
                EN: Used space on volume {#VOLUMENAME} in percent, calculated as 100 * (total - free) / total.
                PL: Zajęte miejsce na wolumenie {#VOLUMENAME} w procentach, wyliczane jako 100 * (całkowity - wolny) / całkowity.
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: storage
                - tag: scope
                  value: capacity
          trigger_prototypes:
            - uuid: 4a38ecafa0ae454389830a5ebac324da
              expression: '(last(/SNMP QNAP TVS-473e/qnap.volume.free[{#SNMPINDEX}]) / last(/SNMP QNAP TVS-473e/qnap.volume.total[{#SNMPINDEX}])) * 100 < {$VFS.FREE.MIN.CRIT:"{#VOLUMENAME}"}'
              name: '{{#VOLUMENAME}.regsub("^[[]Volume (.+), (Pool [0-9]+)[]]$", "\1 (\2)")}: Critically low free space on {HOST.NAME}'
              opdata: 'Free: {ITEM.VALUE1} / Total: {ITEM.VALUE2}'
              priority: HIGH
              description: |
                EN: Free space on volume {#VOLUMENAME} is below {$VFS.FREE.MIN.CRIT:"{#VOLUMENAME}"}%. Free up space or extend the volume now; a full volume stops writes and may stop applications.
                PL: Wolne miejsce na wolumenie {#VOLUMENAME} spadło poniżej {$VFS.FREE.MIN.CRIT:"{#VOLUMENAME}"}%. Zwolnij miejsce albo powiększ wolumen od razu; pełny wolumen blokuje zapis i może zatrzymać aplikacje.
              tags:
                - tag: component
                  value: storage
                - tag: scope
                  value: capacity
            - uuid: 3922ae80ca9f468aa610e085f6cdc7a4
              expression: '(last(/SNMP QNAP TVS-473e/qnap.volume.free[{#SNMPINDEX}]) / last(/SNMP QNAP TVS-473e/qnap.volume.total[{#SNMPINDEX}])) * 100 < {$VFS.FREE.MIN.WARN:"{#VOLUMENAME}"}'
              name: '{{#VOLUMENAME}.regsub("^[[]Volume (.+), (Pool [0-9]+)[]]$", "\1 (\2)")}: Low free space on {HOST.NAME}'
              opdata: '{ITEM.VALUE1} / Total: {ITEM.VALUE2}'
              priority: WARNING
              description: |
                EN: Free space on volume {#VOLUMENAME} is below {$VFS.FREE.MIN.WARN:"{#VOLUMENAME}"}%. Plan a clean-up or an extension of the volume.
                PL: Wolne miejsce na wolumenie {#VOLUMENAME} spadło poniżej {$VFS.FREE.MIN.WARN:"{#VOLUMENAME}"}%. Zaplanuj porządki albo powiększenie wolumenu.
              dependencies:
                - name: '{{#VOLUMENAME}.regsub("^[[]Volume (.+), (Pool [0-9]+)[]]$", "\1 (\2)")}: Critically low free space on {HOST.NAME}'
                  expression: '(last(/SNMP QNAP TVS-473e/qnap.volume.free[{#SNMPINDEX}]) / last(/SNMP QNAP TVS-473e/qnap.volume.total[{#SNMPINDEX}])) * 100 < {$VFS.FREE.MIN.CRIT:"{#VOLUMENAME}"}'
              tags:
                - tag: component
                  value: storage
                - tag: scope
                  value: capacity
          graph_prototypes:
            - uuid: 0f5e181ad41f42bfbbe1f1fcb62f9aa1
              name: '{{#VOLUMENAME}.regsub("^[[]Volume (.+), (Pool [0-9]+)[]]$", "\1 (\2)")}: Free'
              graph_items:
                - color: 1A7C11
                  calc_fnc: ALL
                  item:
                    host: 'SNMP QNAP TVS-473e'
