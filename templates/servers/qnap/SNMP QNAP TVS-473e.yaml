        - uuid: 9fd2708dd79848e99905a71cd04bbaef
          name: 'Disk Performance Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#VOLNAME},1.3.6.1.4.1.24681.1.2.17.1.2]'
