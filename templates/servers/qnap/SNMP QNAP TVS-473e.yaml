                PL: Całkowita pojemność grupy RAID {#RAIDID} w bajtach.
              tags:
                - tag: component
                  value: storage
                - tag: scope
                  value: capacity
        - uuid: 06632a3ef45f4083a3235b281a97a185
          name: 'Logical Volume Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#VOLUMENAME},1.3.6.1.4.1.24681.1.2.17.1.2]'
          key: qnap.volume.discovery
          delay: 1h
          filter:
