        - uuid: 20b1079e5fb64b55806ae19f174d918e
          name: 'Fan Discovery (System and Expansion)'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#FANID},1.3.6.1.4.1.24681.1.4.1.1.1.1.2.2.1.1]'
          key: qnap.fan.discovery.all
