          delay: 1h
          filter:
            conditions:
              - macro: '{#VOLNAME}'
                value: EXDR
                operator: NOT_MATCHES_REGEX
          description: |
            EN: Discovers logical volumes for performance monitoring (IOPS, latency). Volume names come from the QTS volume table and the values from the QTS volume performance table; both use the same index (verified 2026-11-19 with a load test on one volume). External drives (EXDR) are skipped.
            PL: Wykrywa wolumeny logiczne do monitorowania wydajności (IOPS, opóźnienie). Nazwy wolumenów pochodzą z tabeli wolumenów QTS, a wartości z tabeli wydajności wolumenów QTS; obie używają tego samego indeksu (sprawdzone 19.11.2026 testem obciążenia jednego wolumenu). Dyski zewnętrzne (EXDR) są pomijane.
          item_prototypes:
            - uuid: 221f9916a4b94da0a989532442eeebd5
              name: '{{#VOLNAME}.regsub("^[[]Volume (.+), (Pool [0-9]+)[]]$", "\1 (\2)")}: IOPS'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.11.5.6.2.1.3.{#SNMPINDEX}'
              key: 'qnap.disk.iops[{#SNMPINDEX}]'
              delay: 5m
              description: |
                EN: Input/output operations per second on volume {#VOLNAME}, as reported by QTS.
                PL: Liczba operacji wejścia/wyjścia na sekundę na wolumenie {#VOLNAME}, raportowana przez QTS.
              tags:
                - tag: component
                  value: storage
                - tag: scope
                  value: performance
            - uuid: 9136bfb40ed44bb08ecae6e989b4f297
              name: '{{#VOLNAME}.regsub("^[[]Volume (.+), (Pool [0-9]+)[]]$", "\1 (\2)")}: Latency'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.11.5.6.2.1.4.{#SNMPINDEX}'
              key: 'qnap.disk.latency[{#SNMPINDEX}]'
              delay: 5m
              units: ms
              description: |
                EN: Average I/O latency on volume {#VOLNAME} in milliseconds, as reported by QTS. Volumes on NVMe pools usually show 0 ms.
                PL: Średnie opóźnienie operacji I/O na wolumenie {#VOLNAME} w milisekundach, raportowane przez QTS. Wolumeny na poolach NVMe zwykle pokazują 0 ms.
              tags:
                - tag: component
                  value: storage
                - tag: scope
                  value: performance
          graph_prototypes:
            - uuid: 7403980962c8458987ce507ebc7344da
              name: 'Performance: {{#VOLNAME}.regsub("^[[]Volume (.+), (Pool [0-9]+)[]]$", "\1 (\2)")}'
              width: '600'
              height: '300'
              yaxismax: '0'
              graph_items:
                - drawtype: BOLD_LINE
                  color: 1A7C11
                  calc_fnc: ALL
                  item:
                    host: 'SNMP QNAP TVS-473e'
                    key: 'qnap.disk.iops[{#SNMPINDEX}]'
                - sortorder: '1'
                  drawtype: BOLD_LINE
                  color: '274482'
                  yaxisside: RIGHT
                  calc_fnc: ALL
                  item:
                    host: 'SNMP QNAP TVS-473e'
                    key: 'qnap.disk.latency[{#SNMPINDEX}]'
        - uuid: 578a67faaa304a5a97ddeced542cdc52
          name: 'Physical Drive Discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#DRIVENAME},1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.8,{#DRIVESLOT},1.3.6.1.4.1.24681.1.3.11.1.2]'
          key: qnap.drive.discovery
          delay: 1h
          description: |
            EN: Discovers physical drives of the NAS, including M.2 drives on QM2 cards. The drive name comes from the QTS drive table and the slot label (HDD1, HDD2...) from the legacy NAS-MIB table; both tables use the same index (verified 2026-11-19).
            PL: Wykrywa fizyczne dyski NAS-a, włącznie z dyskami M.2 na kartach QM2. Nazwa dysku pochodzi z tabeli dysków QTS, a etykieta slotu (HDD1, HDD2...) ze starszej tabeli NAS-MIB; obie tabele używają tego samego indeksu (sprawdzone 19.11.2026).
          item_prototypes:
            - uuid: 91dc458f609040979f6795491e27c904
              name: '{#DRIVESLOT}: Capacity ({#DRIVENAME})'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.9.{#SNMPINDEX}'
              key: 'qnap.drive.capacity[{#DRIVESLOT}]'
              delay: 24h
              units: B
              description: |
                EN: Capacity of the drive in slot {#DRIVESLOT} ({#DRIVENAME}) in bytes.
                PL: Pojemność dysku w slocie {#DRIVESLOT} ({#DRIVENAME}) w bajtach.
              tags:
                - tag: component
                  value: disk
                - tag: scope
                  value: inventory
            - uuid: 3fd9ee90c4d049489a94946b1a4b2600
              name: '{#DRIVESLOT}: Is Global Spare ({#DRIVENAME})'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.7.{#SNMPINDEX}'
              key: 'qnap.drive.isspare[{#DRIVESLOT}]'
              delay: 5m
              description: |
                EN: Whether the drive in slot {#DRIVESLOT} is a global spare that QTS uses to rebuild a degraded RAID group: Yes or No.
                PL: Czy dysk w slocie {#DRIVESLOT} jest globalnym dyskiem zapasowym, którego QTS używa do odbudowy zdegradowanej grupy RAID: Yes albo No.
              valuemap:
                name: 'QNAP Global Spare'
              tags:
                - tag: component
                  value: disk
                - tag: scope
                  value: inventory
            - uuid: 0b62d86b43344b548e8582b2f0b236da
              name: '{#DRIVESLOT}: SMART Status Code'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.5.{#SNMPINDEX}'
              key: 'qnap.drive.smart.code[{#DRIVESLOT}]'
              delay: 5m
              value_type: FLOAT
              description: |
                EN: Numeric SMART health code of the drive in slot {#DRIVESLOT} ({#DRIVENAME}) from the QNAP private MIB: 0 = Good, 1 = Warning, 2 = Abnormal, -1 = Error. Main drive health indicator for alerting.
                PL: Liczbowy kod stanu SMART dysku w slocie {#DRIVESLOT} ({#DRIVENAME}) z prywatnego MIB QNAP: 0 = Good, 1 = Warning, 2 = Abnormal, -1 = Error. Główny wskaźnik stanu dysku do alarmowania.
              valuemap:
                name: 'QNAP SMART Numeric'
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 10m
              tags:
                - tag: component
                  value: disk
                - tag: scope
                  value: health
              trigger_prototypes:
                - uuid: 73a0025140e34b6fbf5305c0d509cbe3
                  expression: 'last(/SNMP QNAP TVS-473e/qnap.drive.smart.code[{#DRIVESLOT}])<>0'
                  name: '{#DRIVESLOT}: Drive Health is NOT Good (Status: {ITEM.LASTVALUE})'
                  priority: HIGH
                  description: |
                    EN: The SMART status of the drive in slot {#DRIVESLOT} is not Good (Warning, Abnormal or Error). Check the drive in QTS Storage & Snapshots and plan a replacement; the problem stays open until you close it manually.
                    PL: Status SMART dysku w slocie {#DRIVESLOT} nie jest Good (Warning, Abnormal albo Error). Sprawdź dysk w QTS w Pamięci masowej i migawkach i zaplanuj wymianę; problem pozostaje otwarty, dopóki nie zamkniesz go ręcznie.
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: disk
                    - tag: scope
                      value: health
                - uuid: 9f6ffdbdc9424cf09620ff33f09f2618
                  expression: 'nodata(/SNMP QNAP TVS-473e/qnap.drive.smart.code[{#DRIVESLOT}],30m)=1'
                  name: '{#DRIVESLOT}: SMART Status is not responding (No data) on {HOST.NAME}'
                  priority: AVERAGE
                  description: |
                    EN: The drive in slot {#DRIVESLOT} has not reported its SMART status for 30 minutes. Possible causes: the SNMP agent hangs under heavy I/O, or the drive or its controller failed.
                    PL: Dysk w slocie {#DRIVESLOT} nie raportuje statusu SMART od 30 minut. Możliwe przyczyny: agent SNMP zawiesza się przy dużym obciążeniu I/O albo awaria dysku lub kontrolera.
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Host is unavailable'
                      expression: 'max(/SNMP QNAP TVS-473e/icmpping,3m)=0'
                    - name: 'SNMP Agent is unreachable on {HOST.NAME}'
                      expression: 'max(/SNMP QNAP TVS-473e/zabbix[host,snmp,available],5m)=0'
                  tags:
                    - tag: component
                      value: disk
                    - tag: scope
                      value: health
            - uuid: e8932b0f317547ce9ac63d19e9261ea4
              name: '{#DRIVESLOT}: SMART Status Text'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.4.{#SNMPINDEX}'
              key: 'qnap.drive.smart.text[{#DRIVESLOT}]'
              delay: 1h
              trends: '0'
              description: |
                EN: SMART status text of the drive in slot {#DRIVESLOT} converted by JavaScript to a code: 1 = Good (GOOD, OK, NORMAL, HEALTHY, READY), 2 = Warning (WARNING, ABNORMAL), 0 = Error or unknown text. For display only; alerting uses SMART Status Code.
                PL: Tekstowy status SMART dysku w slocie {#DRIVESLOT} zamieniany przez JavaScript na kod: 1 = Good (GOOD, OK, NORMAL, HEALTHY, READY), 2 = Warning (WARNING, ABNORMAL), 0 = błąd albo nieznany tekst. Tylko do wyświetlania; alarmowanie korzysta z SMART Status Code.
              valuemap:
                name: 'QNAP Disk Status'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var status = value.trim().toUpperCase();
                      
                      // Stan OK
                      if (status === "GOOD" || status === "OK" || status === "NORMAL" || status === "HEALTHY" || status === "READY") {
                          return 1;
                      }
                      
                      // Ostrzeżenie / Podejrzany stan
                      if (status === "WARNING" || status === "ABNORMAL") {
                          return 2;
                      }
                      
                      // Błąd / Awaria
                      return 0;
              tags:
                - tag: component
                  value: disk
                - tag: scope
                  value: health
            - uuid: 16d0f12d55f04ccaa465ada0e217300e
              name: '{#DRIVESLOT}: Temperature'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.6.{#SNMPINDEX}'
              key: 'qnap.drive.temp[{#DRIVESLOT}]'
              delay: 10m
              units: °C
              description: |
                EN: Temperature of the drive in slot {#DRIVESLOT} in °C. Thresholds: warning {$TEMP.DISK.WARN} °C, critical {$TEMP.DISK.CRIT} °C.
                PL: Temperatura dysku w slocie {#DRIVESLOT} w °C. Progi: ostrzeżenie {$TEMP.DISK.WARN} °C, krytyczny {$TEMP.DISK.CRIT} °C.
              tags:
                - tag: component
                  value: disk
                - tag: scope
                  value: health
                - tag: sensor
                  value: temperature
              trigger_prototypes:
                - uuid: d4b183a25384460e84e3b3beb7d5d6d1
                  expression: 'last(/SNMP QNAP TVS-473e/qnap.drive.temp[{#DRIVESLOT}])>{$TEMP.DISK.CRIT}'
                  name: '{#DRIVESLOT}: Temperature is critical ({ITEM.VALUE1} on {HOST.NAME})'
                  priority: HIGH
                  description: |
                    EN: The drive in slot {#DRIVESLOT} is above {$TEMP.DISK.CRIT} °C. The risk of failure and data loss rises sharply; check the fans and air flow now.
                    PL: Dysk w slocie {#DRIVESLOT} przekracza {$TEMP.DISK.CRIT} °C. Ryzyko awarii i utraty danych gwałtownie rośnie; sprawdź od razu wentylatory i przepływ powietrza.
                  manual_close: 'YES'
                  tags:
                    - tag: cause
                      value: overheating
                    - tag: component
                      value: disk
                    - tag: scope
                      value: health
                - uuid: 06a89795f37b401784262d52637c566d
                  expression: 'last(/SNMP QNAP TVS-473e/qnap.drive.temp[{#DRIVESLOT}])>{$TEMP.DISK.WARN}'
                  name: '{#DRIVESLOT}: Temperature is high ({ITEM.VALUE1} on {HOST.NAME})'
                  priority: WARNING
                  description: |
                    EN: The drive in slot {#DRIVESLOT} is above {$TEMP.DISK.WARN} °C. Usually points to poor air flow or a dusty enclosure.
                    PL: Dysk w slocie {#DRIVESLOT} przekracza {$TEMP.DISK.WARN} °C. Zwykle wskazuje na słaby przepływ powietrza albo zakurzoną obudowę.
                  manual_close: 'YES'
                  dependencies:
                    - name: '{#DRIVESLOT}: Temperature is critical ({ITEM.VALUE1} on {HOST.NAME})'
                      expression: 'last(/SNMP QNAP TVS-473e/qnap.drive.temp[{#DRIVESLOT}])>{$TEMP.DISK.CRIT}'
                  tags:
                    - tag: cause
                      value: overheating
                    - tag: component
                      value: disk
                    - tag: scope
                      value: health
                - uuid: aac2a06ad888469a99e7d6f449d8e675
                  expression: 'nodata(/SNMP QNAP TVS-473e/qnap.drive.temp[{#DRIVESLOT}],30m)=1'
                  name: '{#DRIVESLOT}: Temperature sensor is not responding (No data)'
                  priority: AVERAGE
                  description: |
                    EN: No temperature readings for the drive in slot {#DRIVESLOT} for 30 minutes. The thermal state of the drive cannot be verified.
                    PL: Brak odczytów temperatury dysku w slocie {#DRIVESLOT} od 30 minut. Nie da się zweryfikować stanu termicznego dysku.
                  dependencies:
                    - name: 'Host is unavailable'
                      expression: 'max(/SNMP QNAP TVS-473e/icmpping,3m)=0'
                    - name: 'SNMP Agent is unreachable on {HOST.NAME}'
                      expression: 'max(/SNMP QNAP TVS-473e/zabbix[host,snmp,available],5m)=0'
                  tags:
                    - tag: component
                      value: disk
                    - tag: scope
                      value: availability
            - uuid: be4a5c7492cd4817b9c87082fb320e14
              name: '{#DRIVESLOT}: Drive Type'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.4.1.1.1.1.5.2.1.8.{#SNMPINDEX}'
              key: 'qnap.drive.type[{#DRIVESLOT}]'
              delay: 24h
              value_type: CHAR
              description: |
                EN: Drive interface type taken from the drive description, e.g. SATA or NVMe. QTS reports NVMe drives on QM2 cards as SAS, so preprocessing replaces SAS with NVMe (verified on the WD Red SN700 in QM2-2P-244A, 2026-11-19).
                PL: Typ interfejsu dysku pobierany z opisu dysku, np. SATA albo NVMe. QTS raportuje dyski NVMe na kartach QM2 jako SAS, więc preprocessing zamienia SAS na NVMe (sprawdzone na WD Red SN700 w QM2-2P-244A, 19.11.2026).
              preprocessing:
                - type: REGEX
                  parameters:
                    - '\((.*)\)'
                    - \1
                - type: STR_REPLACE
                  parameters:
                    - SAS
                    - NVMe
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 24h
              tags:
                - tag: component
                  value: disk
                - tag: scope
                  value: inventory
          graph_prototypes:
            - uuid: e71e53f6b5544ea6a5b5b926e0d60c16
              name: '{#DRIVESLOT}: Temperature ({#DRIVENAME})'
              width: '200'
              show_work_period: 'NO'
              show_triggers: 'NO'
              type: PIE
              show_3d: 'YES'
              graph_items:
                - color: 1A7C11
                  calc_fnc: LAST
                  type: GRAPH_SUM
                  item:
                    host: 'SNMP QNAP TVS-473e'
                    key: 'qnap.drive.temp[{#DRIVESLOT}]'
        - uuid: c41a1449d01943ed9f0bef55d33f2020
          name: 'External Drive Discovery (USB/eSATA)'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#EXTNAME},1.3.6.1.4.1.24681.1.2.17.1.2]'
          key: qnap.external.discovery
          delay: 1h
          filter:
            conditions:
              - macro: '{#EXTNAME}'
                value: EXDR
          lifetime: 365d
          enabled_lifetime_type: DISABLE_NEVER
          description: |
            EN: Discovers external USB/eSATA drives connected to the NAS (volumes named EXDR in the QTS volume table) and monitors their status and free space. Items of a disconnected drive are kept for 365 days to preserve its history.
            PL: Wykrywa dyski zewnętrzne USB/eSATA podłączone do NAS-a (wolumeny o nazwie EXDR w tabeli wolumenów QTS) i monitoruje ich status oraz wolne miejsce. Itemy odłączonego dysku są trzymane przez 365 dni, żeby zachować jego historię.
          item_prototypes:
            - uuid: cbf58d3681ce4406a9992e090bcd90a0
              name: 'USB Drive: Free Space ({#EXTNAME})'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.24681.1.2.17.1.5.{#SNMPINDEX}'
              key: 'qnap.external.free[{#SNMPINDEX}]'
              delay: 15m
              trends: '0'
              units: B
              description: |
                EN: Free space on external drive {#EXTNAME} in bytes. QTS returns text with a unit; JavaScript preprocessing converts it to whole bytes.
                PL: Wolne miejsce na dysku zewnętrznym {#EXTNAME} w bajtach. QTS zwraca tekst z jednostką; preprocessing JavaScript przelicza go na pełne bajty.
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      // 1. Usuń wszystkie spacje z tekstu (np. "1.5 TB" -> "1.5TB")
                      var value_clean = value.replace(/\s+/g, '');
                      
                      // 2. Wyciągnij samą jednostkę (wszystko co nie jest cyfrą ani kropką)
                      var unit = value_clean.replace(/[0-9.]/g, '').toUpperCase();
                      
                      // 3. Wyciągnij samą liczbę
                      var num = parseFloat(value_clean);
                      
                      // 4. Jeśli wynik nie jest liczbą, zwróć błąd (zabezpieczenie)
                      if (isNaN(num)) {
                          throw 'Błąd: Wartość nie jest liczbą (' + value + ')';
                      }
                      
                      // 5. Przelicz na bajty w zależności od wykrytej jednostki
                      if (unit === 'TB') {
                          return Math.round(num * 1024 * 1024 * 1024 * 1024);
                      } else if (unit === 'GB') {
                          return Math.round(num * 1024 * 1024 * 1024);
                      } else if (unit === 'MB') {
                          return Math.round(num * 1024 * 1024);
                      } else if (unit === 'KB') {
                          return Math.round(num * 1024);
                      }
                      
                      // Jeśli nie ma jednostki, zakładamy że to już są bajty
                      return Math.round(num);
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              tags:
                - tag: component
                  value: external
                - tag: scope
                  value: capacity
            - uuid: 76601b40aeda4e97b519c43134ff2e60
